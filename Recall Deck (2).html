<style>
/* Layout: one narrow column. A tab strip sits on top like card-index dividers, the question card is the centrepiece. */
:root {
  --bg: #eceff1;
  --surface: #fbfcfc;
  --ink: #15212b;
  --muted: #5b6874;
  --line: #d0d7dc;
  --accent: #a8480c;
  --accent-ink: #ffffff;
  --good: #17744f;
  --bad: #b4262f;
  --track: #dde3e7;
  --display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --body: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11181e; --surface: #19232b; --ink: #e8edf0; --muted: #94a2ad; --line: #2c3a45;
    --accent: #f0a24b; --accent-ink: #1a1204; --good: #4fc596; --bad: #f0707a; --track: #26333d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11181e; --surface: #19232b; --ink: #e8edf0; --muted: #94a2ad; --line: #2c3a45;
  --accent: #f0a24b; --accent-ink: #1a1204; --good: #4fc596; --bad: #f0707a; --track: #26333d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-weight: 700; font-size: 1.75rem; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
.sub { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); }
nav { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
nav button {
  background: none; border: 0; border-bottom: 3px solid transparent; color: var(--muted);
  font: 500 0.95rem var(--body); padding: 10px 12px 9px; cursor: pointer; white-space: nowrap;
}
nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
button:focus-visible, input:focus-visible, textarea:focus-visible, .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.meter { display: flex; gap: 20px; flex-wrap: wrap; font-family: var(--mono); font-size: 0.82rem; color: var(--muted); }
.meter b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 28px 24px;
  min-height: 260px; display: flex; flex-direction: column; gap: 18px; cursor: pointer;
}
.topic { font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 12px; }
.q { font-family: var(--display); font-weight: 500; font-size: 1.5rem; line-height: 1.25; text-wrap: balance; margin: 0; }
.ans { border-top: 1px dashed var(--line); padding-top: 16px; font-size: 1.05rem; max-width: 62ch; }
.hint { margin-top: auto; font-size: 0.82rem; color: var(--muted); }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.btn {
  font: 600 1rem var(--body); padding: 14px 16px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); cursor: pointer;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.miss { color: var(--bad); border-color: var(--bad); }
.btn.hit { color: var(--good); border-color: var(--good); }
.btn.small { padding: 8px 12px; font-size: 0.88rem; font-weight: 500; }
.btn.full { grid-column: 1 / -1; }
kbd { font-family: var(--mono); font-size: 0.75rem; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; margin-left: 6px; opacity: 0.75; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.panel h2 { font-family: var(--display); font-size: 1.15rem; margin: 0; }
label { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; color: var(--muted); }
input, textarea, select {
  font: 400 1rem var(--body); color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 4px; padding: 10px 12px; width: 100%;
}
textarea { min-height: 120px; resize: vertical; font-family: var(--mono); font-size: 0.85rem; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.list { display: flex; flex-direction: column; }
.item { display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); }
.item > div { min-width: 0; }
.item .t { font-weight: 500; overflow-wrap: anywhere; }
.item .s { color: var(--muted); font-size: 0.9rem; overflow-wrap: anywhere; }
.tag { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; margin-left: 6px; vertical-align: middle; }
.bars { display: flex; flex-direction: column; gap: 14px; }
.bar-head { display: flex; justify-content: space-between; gap: 12px; font-size: 0.92rem; }
.bar-head span:last-child { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.track { height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; margin-top: 4px; }
.fill { height: 100%; background: var(--good); }
.fill.weak { background: var(--bad); }
.fill.mid { background: var(--accent); }
.boxes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.boxes div { border: 1px solid var(--line); border-radius: 4px; padding: 8px; text-align: center; font-family: var(--mono); font-size: 0.75rem; color: var(--muted); }
.boxes b { display: block; font-size: 1.2rem; color: var(--ink); font-weight: 500; }
.empty { text-align: center; padding: 36px 12px; color: var(--muted); }
.empty h2 { font-family: var(--display); color: var(--ink); margin: 0 0 6px; }
.note { font-size: 0.85rem; color: var(--muted); margin: 0; }
.toast { font-size: 0.88rem; color: var(--good); min-height: 1.2em; }
  .panel ul { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; }
.panel li { max-width: 62ch; }
.done { align-items: center; text-align: center; padding: 32px 20px; }
.done .actions { width: 100%; max-width: 420px; }
.pct { font-family: var(--display); font-weight: 700; font-size: 4.5rem; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.big { font-size: 1.15rem; margin: 0; }
.kick { font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.hero { font-family: var(--display); font-weight: 700; font-size: clamp(2rem, 8vw, 3rem); line-height: 1.05; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; font: 400 1rem var(--body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; cursor: pointer; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt .ltr { font-family: var(--mono); font-size: 0.8rem; border: 1px solid var(--line); border-radius: 3px; min-width: 1.6em; text-align: center; padding: 1px 0; flex: none; }
.opt span:last-child { min-width: 0; overflow-wrap: anywhere; }
.opt.right { border-color: var(--good); border-width: 2px; }
.opt.wrong { border-color: var(--bad); border-width: 2px; }
.fb { border-top: 1px dashed var(--line); padding-top: 14px; max-width: 62ch; }
.fb.good b { color: var(--good); }
.fb.bad b { color: var(--bad); }
.tally { display: inline-flex; gap: 18px; align-items: center; }
.tally span { display: inline-flex; gap: 6px; align-items: center; }
.tally b { font-size: 1.05rem; }
.tally .ok { color: var(--good); }
.tally .no { color: var(--bad); }
.unit-h { font-family: var(--display); font-size: 1.3rem; margin: 28px 0 12px; }
@media (prefers-reduced-motion: no-preference) { .fill { transition: width 0.3s; } }
</style>

<script>
(function () {
  var KEY = 'recall-deck.v1';
  var cards = [], unit = 'all', tab = 'study', queue = [], welcome = true, running = false, total = 0, right = 0, missed = [], flipped = false, toast = '';

  function load() {
    try { var raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch (e) {}
    return null;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(cards)); } catch (e) {} }
  function uid() { return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function mk(q, a, topic, ex) { return { id: uid(), q: q, a: a, topic: topic || 'General', box: 1, due: Date.now(), correct: 0, wrong: 0, ex: !!ex }; }

  var UNITS = [["1.1 Systems architecture", [["What is the purpose of the CPU?", "To process data and instructions by repeatedly fetching, decoding and executing them."], ["What does the ALU (arithmetic logic unit) do?", "It carries out arithmetic (such as add and subtract), logic operations (AND, OR, NOT) and comparisons."], ["What does the control unit (CU) do?", "It controls and coordinates the CPU. It fetches and decodes instructions and sends signals to direct data around the CPU."], ["What is cache?", "Very fast memory in or close to the CPU that holds frequently used data and instructions, so the CPU waits less for RAM."], ["What are registers?", "Tiny, extremely fast storage locations inside the CPU that hold the data and addresses being used right now."], ["What is Von Neumann architecture?", "A design where data and instructions are stored together in the same main memory, and the CPU fetches them from there."], ["What does the MAR (memory address register) hold?", "The address in memory of the data or instruction that is about to be fetched or written."], ["What does the MDR (memory data register) hold?", "The data or instruction that has just been fetched from memory, or is about to be written to memory."], ["What does the program counter (PC) hold?", "The address of the next instruction to be fetched. It goes up by one after each fetch."], ["What does the accumulator store?", "The results of calculations done by the ALU."], ["What are the stages of the fetch-decode-execute cycle?", "Fetch the instruction from memory, decode it in the control unit, then execute it. The cycle then repeats."], ["What happens to the address in the PC during the fetch stage?", "It is copied to the MAR. The instruction at that address is fetched into the MDR, and the PC goes up by one."], ["Name three things that affect CPU performance.", "Clock speed, cache size and the number of cores."], ["How does clock speed affect performance?", "It is measured in GHz. A higher clock speed means more cycles per second, so more instructions are processed each second."], ["How does cache size affect performance?", "A bigger cache keeps more frequently used data close to the CPU, so there are fewer slow trips to RAM."], ["How do more cores affect performance?", "Each core can process instructions at the same time, so more tasks can run in parallel. The software has to be able to use them."], ["What is an embedded system?", "A computer built into a larger device to do one dedicated job, usually with a limited or no user interface."], ["Give three examples of embedded systems.", "Washing machine controller, microwave, traffic lights, car engine management, central heating controller, digital watch."], ["How does an embedded system differ from a general purpose computer?", "It does one fixed task instead of many, usually runs a fixed program, and is small, low power and cheap."]], [["The CPU", ["The CPU processes data and instructions by running the fetch-decode-execute cycle over and over.", "ALU: does arithmetic, logic operations and comparisons.", "Control unit (CU): controls and coordinates the CPU, decodes instructions and sends control signals.", "Cache: very fast memory close to the CPU for frequently used data and instructions.", "Registers: tiny, very fast storage inside the CPU for data and addresses in use right now."]], ["Von Neumann architecture", ["Data and instructions are stored together in the same main memory, in binary.", "The CPU fetches instructions from memory one at a time.", "It uses specific registers: MAR, MDR, program counter and accumulator."]], ["The four registers", ["MAR (memory address register): the address to read from or write to.", "MDR (memory data register): the data or instruction that was fetched or is about to be written.", "Program counter (PC): the address of the next instruction. It goes up by one after each fetch.", "Accumulator: stores the results of ALU calculations."]], ["Fetch-decode-execute", ["Fetch: the PC address is copied to the MAR, the instruction is fetched into the MDR and the PC goes up by one.", "Decode: the control unit works out what the instruction means.", "Execute: the instruction is carried out, for example the ALU does a calculation. Then the cycle repeats."]], ["CPU performance", ["Clock speed (GHz): more cycles per second means more instructions per second.", "Cache size: more cache means fewer slow trips to RAM.", "Number of cores: more cores can run more instructions at once, but only if the software can use them."]], ["Embedded systems", ["A computer inside a larger device that does one dedicated job.", "Usually a fixed program, small, low power, cheap and with little or no user interface.", "Examples: washing machines, microwaves, traffic lights, car engine management, central heating controllers."]]]], ["1.2 Memory and storage", [["Why does a computer need primary storage?", "The CPU can only directly access data and instructions in primary storage, so programs and data must be loaded there to run."], ["What is RAM?", "Random access memory. It is volatile, can be read and written, and holds the data and programs currently in use."], ["What is ROM?", "Read-only memory. It is non-volatile and holds the boot-up instructions. Its contents are not normally changed."], ["What is the difference between volatile and non-volatile memory?", "Volatile memory loses its contents when the power is off (RAM). Non-volatile memory keeps them (ROM, secondary storage)."], ["What is virtual memory?", "Part of secondary storage used as extra RAM when RAM is full. Data not needed right now is moved out of RAM and swapped back when it is needed."], ["Why is virtual memory slower than RAM?", "Secondary storage is much slower to access than RAM, so swapping data in and out causes delays."], ["Why do computers need secondary storage?", "It is non-volatile, so it keeps programs and data when the power is off, and it offers far more capacity than primary storage."], ["Name the three types of secondary storage.", "Magnetic (hard disk drive), optical (CD, DVD, Blu-ray) and solid state (SSD, USB flash drive, SD card)."], ["What are the features of magnetic storage?", "Large capacity and cheap per GB, but it has moving parts, so it is slower, more fragile and less portable than solid state."], ["What are the features of optical storage?", "Low capacity, slow, and discs scratch easily, but the discs are cheap and portable."], ["What are the features of solid state storage?", "No moving parts, so it is fast, durable, quiet and low power. It costs more per GB than magnetic."], ["What is a bit?", "A single binary digit, 0 or 1. It is the smallest unit of data."], ["What are a nibble and a byte?", "A nibble is 4 bits. A byte is 8 bits."], ["What is the order of data units from kilobyte upwards?", "Kilobyte (KB), megabyte (MB), gigabyte (GB), terabyte (TB), petabyte (PB). Each is 1000 times the one before."], ["How do you calculate the file size of an image?", "Colour depth x width x height (in pixels). The answer is in bits."], ["How do you calculate the file size of a sound file?", "Sample rate x duration (in seconds) x bit depth."], ["How do you calculate the file size of a text file?", "Bits per character x number of characters."], ["How do you convert binary to denary?", "Write the place values 128, 64, 32, 16, 8, 4, 2, 1 above the bits and add up the values that have a 1 under them."], ["Convert the binary number 10110110 to denary.", "182 (128 + 32 + 16 + 4 + 2)."], ["Convert the denary number 45 to 8-bit binary.", "00101101 (32 + 8 + 4 + 1)."], ["What are the rules of binary addition?", "0+0=0, 0+1=1, 1+1=10 (write 0, carry 1), and 1+1+1=11 (write 1, carry 1)."], ["What is an overflow error?", "It happens when the result of a calculation is too big for the number of bits available, for example a ninth bit in an 8-bit number."], ["Why is hexadecimal used?", "It is shorter and easier for people to read and write than binary, with fewer mistakes. One hex digit represents 4 bits."], ["Convert the binary number 10111110 to hexadecimal.", "BE (1011 = B and 1110 = E)."], ["Convert the hexadecimal number 3F to denary.", "63 (3 x 16 + 15)."], ["What does a binary shift do?", "A left shift moves the bits left and multiplies by 2 for each place. A right shift divides by 2 for each place. The gaps are filled with 0s."], ["What is a character set?", "A defined list of characters that a computer can recognise, each with its own unique binary code."], ["What is ASCII?", "A character set that uses 7 bits per character, giving 128 characters. It covers mainly English letters, digits and symbols."], ["What is Unicode and why is it used?", "A much larger character set using more bits per character. It covers many languages and emojis, but files are bigger."], ["What is a pixel?", "The smallest element of an image. Each pixel is stored as a binary value for its colour."], ["What is colour depth?", "The number of bits used for each pixel. More bits means more colours but a bigger file."], ["What is resolution?", "The number of pixels in an image (width x height). More pixels means more detail but a bigger file."], ["What is metadata for an image?", "Data about the image file, such as its width, height and colour depth, which is needed to display it."], ["How is sound stored digitally?", "The height of the analogue sound wave is measured at regular intervals (sampled) and each measurement is stored as binary."], ["What is sample rate?", "The number of samples taken per second, measured in hertz. A higher rate gives better quality and a bigger file."], ["What is bit depth for sound?", "The number of bits used for each sample. A higher bit depth gives more accurate sound and a bigger file."], ["Why is compression needed?", "Smaller files use less storage and less bandwidth, so they download and send faster."], ["What is lossy compression?", "It permanently removes some data to make the file smaller. The original cannot be restored. Examples are JPEG and MP3."], ["What is lossless compression?", "It makes the file smaller without losing any data, so the original can be rebuilt exactly. Examples are PNG and ZIP."]], [["Primary storage", ["Needed because the CPU can only directly access data and instructions in primary storage.", "RAM: volatile, read and write, holds programs and data in use.", "ROM: non-volatile, holds the boot-up instructions.", "Virtual memory: part of secondary storage used as RAM when RAM is full. It is slower because secondary storage is slower."]], ["Secondary storage", ["Needed because it is non-volatile and has large capacity.", "Magnetic: large and cheap, but slower, fragile and moving parts.", "Optical: low capacity, slow, scratches, cheap and portable.", "Solid state: fast, durable and quiet, but more expensive per GB.", "Compare on capacity, speed, portability, durability, reliability and cost."]], ["Units and file sizes", ["Bit, nibble (4 bits), byte (8 bits), KB, MB, GB, TB, PB. Each step is x1000.", "Image size = colour depth x width x height.", "Sound size = sample rate x duration x bit depth.", "Text size = bits per character x number of characters."]], ["Binary, hex and shifts", ["Place values: 128, 64, 32, 16, 8, 4, 2, 1.", "Binary addition: 1+1=10, 1+1+1=11. Overflow if the result needs more bits than are available.", "Hex: one digit = 4 bits. A=10 up to F=15.", "Left shift x2 per place. Right shift divide by 2 per place."]], ["Characters, images and sound", ["ASCII: 7 bits, 128 characters. Unicode: more bits and many more characters.", "Image: pixels, colour depth and resolution. More of either means a bigger file.", "Sound: sample rate and bit depth. Higher values mean better quality and a bigger file."]], ["Compression", ["Lossy: removes data permanently (JPEG, MP3).", "Lossless: no data lost, original can be rebuilt (PNG, ZIP).", "Needed to save storage space and bandwidth."]]]], ["1.3 Networks, connections and protocols", [["What is a LAN?", "A local area network covers a small geographical area, such as one building or site, and is owned and managed by one organisation."], ["What is a WAN?", "A wide area network covers a large geographical area and joins LANs together. It uses infrastructure leased from telecoms companies. The Internet is the largest WAN."], ["Name factors that affect network performance.", "Bandwidth, the number of devices on the network, the type of transmission media, and the network topology."], ["What is a client-server network?", "A central server provides files and services and manages security, and clients request them. It is easy to back up and secure, but the server is costly and a single point of failure."], ["What is a peer-to-peer network?", "Every device is equal and shares files directly with the others, with no central server. It is cheap and simple but harder to secure and back up."], ["What does a router do?", "It sends data packets between networks and connects a LAN to the Internet."], ["What does a switch do?", "It connects devices on a LAN and sends data only to the device it is meant for."], ["What does a wireless access point (WAP) do?", "It lets wireless devices connect to a wired network."], ["What does a network interface card (NIC) do?", "It lets a device connect to a network. It also holds the device's MAC address."], ["Compare fibre optic and copper cable.", "Fibre is faster, carries data further and has less interference, but costs more. Copper is cheaper but slower and loses signal over distance."], ["What is the difference between the Internet and the World Wide Web?", "The Internet is the worldwide network of networks. The World Wide Web is the collection of websites and pages that are accessed over the Internet."], ["What is DNS?", "The domain name system. DNS servers translate domain names such as bbc.co.uk into IP addresses."], ["What is the cloud?", "Storing and accessing data and software on remote servers over the Internet. It can be reached from anywhere, but it needs an Internet connection and has ongoing costs."], ["Describe a star topology and give a pro and a con.", "Every device connects to a central switch. If one cable fails the others still work, but if the switch fails the whole network goes down."], ["Describe a mesh topology and give a pro and a con.", "Devices connect to many other devices. There are many routes, so it is reliable, but it needs lots of cabling and is expensive."], ["What is Wi-Fi?", "Wireless networking using radio waves. It is convenient and allows movement, but it can be slower, less secure and affected by interference."], ["What is Bluetooth used for?", "Short range, low power wireless connections between devices, such as headphones and a phone."], ["Why is encryption used on wireless networks?", "Wireless signals can be intercepted, so encryption scrambles the data and it cannot be read without the key."], ["What is an IP address?", "A unique address given to a device on a network so data packets can be routed to it. It can change."], ["What is a MAC address?", "A unique hardware address given to a NIC when it is made. It does not change and is written in hexadecimal."], ["What is a protocol?", "A set of rules for how devices communicate and how data is sent."], ["What does TCP/IP do?", "TCP splits data into packets and puts them back together. IP addresses the packets and routes them to the destination."], ["What are HTTP and HTTPS?", "Protocols for sending web pages. HTTPS is the encrypted, secure version."], ["What is FTP used for?", "Transferring files between computers over a network."], ["What are SMTP, POP and IMAP?", "SMTP sends email. POP downloads email from the server. IMAP keeps email on the server so it can be synced across devices."], ["Why are network protocols split into layers?", "Each layer does one job and can be developed and fixed separately, and it helps different manufacturers' devices work together."], ["What is a standard?", "An agreed set of rules, so that hardware and software from different makers can work together."]], [["Types of network", ["LAN: small area, one organisation.", "WAN: large area, joins LANs, leased infrastructure. The Internet is the largest.", "Performance depends on bandwidth, number of devices, transmission media and topology."]], ["Client-server and peer-to-peer", ["Client-server: central server, easy to secure and back up, server is costly and a single point of failure.", "Peer-to-peer: no server, devices share directly, cheap but harder to secure and back up."]], ["Network hardware", ["Router: sends packets between networks and connects to the Internet.", "Switch: sends data only to the intended device on a LAN.", "WAP: lets wireless devices join a wired network.", "NIC: connects a device to the network.", "Transmission media: copper (cheaper) or fibre (faster, longer, costs more)."]], ["The Internet, DNS and the cloud", ["Internet: network of networks. The web: pages accessed over it.", "DNS: turns domain names into IP addresses.", "Cloud: remote servers storing data and software, accessed over the Internet."]], ["Topologies", ["Star: devices connect to a central switch. Resilient to a cable failure, but the switch is a single point of failure.", "Mesh: devices connect to many others. Very reliable but expensive and complex."]], ["Wireless and addressing", ["Wi-Fi and Bluetooth use radio waves. Encryption protects wireless data.", "IP address: logical, can change, used to route packets.", "MAC address: fixed hardware address on the NIC."]], ["Protocols and layers", ["TCP/IP: TCP splits into packets and reassembles, IP routes them.", "HTTP and HTTPS for the web (HTTPS is encrypted). FTP for files.", "SMTP sends email. POP downloads it. IMAP keeps it on the server.", "Layers split communication into separate jobs. Standards let different devices work together."]]]], ["1.4 Network security", [["What is malware?", "Malicious software designed to damage a computer or gain unauthorised access. Examples are viruses, worms, trojans, ransomware and spyware."], ["What is the difference between a virus, a worm and a trojan?", "A virus attaches to files and needs a user to run it. A worm copies itself across networks on its own. A trojan pretends to be legitimate software."], ["What is ransomware?", "Malware that encrypts a user's files and demands payment to unlock them."], ["What is spyware?", "Malware that secretly records what a user does, such as keystrokes, and sends it to an attacker."], ["What is social engineering?", "Tricking or manipulating people into giving away information or access."], ["What is phishing and how can you spot it?", "Fake emails, messages or sites that trick people into giving personal details. Warning signs are spelling mistakes, an urgent tone and suspicious links."], ["What is a brute-force attack?", "Trying every possible password combination until the right one is found. Long, complex passwords make it take much longer."], ["What is a denial of service (DoS) attack?", "Flooding a server with requests so it cannot respond to genuine users. A DDoS attack uses many computers."], ["What is data interception?", "Capturing data as it travels across a network, for example with packet sniffing. Encryption makes the stolen data unreadable."], ["What is SQL injection?", "Typing SQL code into an input box to read, change or delete a database. Input validation helps to prevent it."], ["What is penetration testing?", "Authorised attempts to break into a system, to find weaknesses before real attackers do."], ["What does anti-malware software do?", "It scans for known malware, then removes it or quarantines it. It must be kept up to date."], ["What does a firewall do?", "It checks incoming and outgoing network traffic against a set of rules and blocks anything unauthorised."], ["What are user access levels?", "Settings that control who can see or change which data, such as read only, edit or administrator."], ["What makes a strong password?", "Long, with a mix of upper and lower case, numbers and symbols, not easy to guess, different for each account and changed regularly."], ["What is encryption?", "Scrambling data into cipher text that cannot be understood without the key."], ["Give examples of physical security.", "Locks, biometric scanners, CCTV and security guards."]], [["Threats", ["Malware: viruses, worms, trojans, ransomware, spyware.", "Social engineering and phishing trick people into giving away details.", "Brute force: tries every combination of password.", "DoS: floods a server so real users cannot get in.", "Data interception: captures data in transit.", "SQL injection: SQL typed into an input box to attack a database."]], ["Prevention", ["Penetration testing: authorised hacking to find weaknesses.", "Anti-malware and firewalls, kept up to date.", "User access levels and strong passwords.", "Encryption so that stolen data is unreadable.", "Physical security: locks, biometrics, CCTV."]]]], ["1.5 Systems software", [["What is the purpose of an operating system?", "Software that manages the computer's hardware and provides a platform for other software to run."], ["What does the user interface do?", "It lets the user interact with the computer, for example through a graphical interface or a command line."], ["What does the OS do for memory management?", "It gives RAM to programs, stops them overwriting each other and moves data to and from virtual memory."], ["What is multitasking?", "The OS shares CPU time between programs so several seem to run at the same time."], ["What is a device driver?", "Software that lets the OS communicate with a piece of hardware by translating OS instructions into ones the device understands."], ["What does the OS do for peripheral management?", "It controls input and output devices using drivers, and handles data sent to and from them."], ["What does the OS do for user management?", "It manages user accounts, passwords and access rights, and keeps each user's settings and files separate."], ["What does the OS do for file management?", "It organises files into folders and lets the user create, rename, move, copy, delete and set permissions on them."], ["What is utility software?", "System maintenance programs that help look after the computer, such as encryption software, defragmentation and compression."], ["What is defragmentation?", "Rearranging the scattered pieces of files on a magnetic hard disk so they are stored together, which speeds up reading. It is not needed for SSDs."], ["Why do files become fragmented?", "When there is no free space big enough, a file is saved in several separate blocks across the disk."], ["What does encryption software do?", "It scrambles stored files so only someone with the key can read them."], ["What does compression software do?", "It makes files smaller so they use less storage space and are quicker to send."]], [["Operating systems", ["The OS manages hardware and lets other software run.", "User interface: how the user interacts with the computer.", "Memory management and multitasking: shares RAM and CPU time between programs.", "Peripheral management: controls devices using drivers.", "User management: accounts, passwords and access rights.", "File management: folders, copying, moving and permissions."]], ["Utility software", ["Encryption software: scrambles stored files.", "Defragmentation: puts file pieces back together on a magnetic disk to speed up access.", "Compression software: makes files smaller."]]]], ["1.6 Ethical, legal, cultural and environmental impacts", [["What is an ethical issue in technology?", "A moral concern about how technology is used, for example AI making decisions, surveillance, job losses from automation, or the digital divide."], ["What is a legal issue in technology?", "A matter covered by law, such as data protection, unauthorised access to computers or copying software."], ["What is a cultural issue in technology?", "How technology changes the way groups of people live, for example social media, smartphones or the digital divide."], ["Give environmental impacts of technology.", "Energy use by devices and data centres, raw materials used in manufacturing, and e-waste. It can also reduce paper use and travel."], ["What is e-waste and why is it a problem?", "Discarded electronic devices. They contain toxic materials that can pollute if not recycled or disposed of properly."], ["What is a privacy issue?", "Concerns about personal data being collected, tracked or shared, and who has access to it."], ["What is the Data Protection Act 2018?", "A law controlling how personal data is used. It must be used fairly and lawfully, be accurate, be kept secure and not be kept longer than needed. People can see the data held about them."], ["What is the Computer Misuse Act 1990?", "A law that makes it illegal to access a computer without permission, to access it to commit further crimes, or to change data without permission (for example with malware)."], ["What is the Copyright, Designs and Patents Act 1988?", "A law that protects creators' work, making it illegal to copy, share or sell software, music or films without permission."], ["What is open source software?", "Software whose source code is freely available, so anyone can view, change and share it. It is often free."], ["What is proprietary software?", "Software where the source code is kept secret. Users pay for a licence and cannot change or share it, but the supplier provides support."], ["Compare open source and proprietary software.", "Open source is often free and can be modified, but support may be limited. Proprietary costs money and cannot be modified, but usually has official support."]], [["Impacts of technology", ["Ethical: moral concerns such as AI decisions, surveillance and job losses.", "Legal: laws that govern the use of technology.", "Cultural: how technology changes the way people live and communicate.", "Environmental: energy use, raw materials, e-waste. It can also cut paper use and travel.", "Privacy: how personal data is collected, tracked and shared."]], ["Legislation", ["Data Protection Act 2018: personal data must be used fairly, lawfully, kept accurate and secure, and not kept longer than needed.", "Computer Misuse Act 1990: illegal to access or change computer material without permission.", "Copyright, Designs and Patents Act 1988: illegal to copy or share creators' work without permission."]], ["Software licences", ["Open source: source code available to view, change and share. Often free.", "Proprietary: source code secret, licence paid for, cannot be modified or shared, supplier gives support."]]]], ["2.1 Algorithms", [["What is abstraction?", "Removing unnecessary detail to focus on what matters, such as a tube map that shows stations and lines but not real distances."], ["What is decomposition?", "Breaking a large problem into smaller parts that are easier to solve."], ["What is algorithmic thinking?", "Working out a step-by-step solution to a problem."], ["What is a structure diagram?", "A diagram that shows a problem broken down into smaller sub-problems in a hierarchy."], ["What do the main flowchart symbols mean?", "Oval: start or end. Rectangle: process. Diamond: decision. Parallelogram: input or output. Arrows: the flow."], ["What is pseudocode?", "A way of writing an algorithm using programming-like statements without following the exact rules of any one language."], ["What is a trace table used for?", "Following an algorithm step by step and recording the value of each variable, to predict the output or find errors."], ["What is the difference between a syntax error and a logic error?", "A syntax error breaks the rules of the language and stops the program running. A logic error lets it run but gives the wrong result."], ["How does a linear search work?", "It checks each item in turn from the start until the item is found or the end of the list is reached. It works on unsorted lists but is slow for big lists."], ["How does a binary search work?", "The list must be sorted. Compare with the middle item, discard the half that cannot contain the item, and repeat. It is much faster for big lists."], ["What is the main requirement of a binary search?", "The data must already be sorted."], ["How does a bubble sort work?", "It compares adjacent pairs and swaps them if they are in the wrong order. It repeats passes until no swaps are made. It is simple but slow."], ["How does a merge sort work?", "It splits the list in half again and again until there are single items, then merges the sublists back together in order. It is fast on big lists but uses more memory."], ["How does an insertion sort work?", "It takes each item in turn and inserts it into the correct place in the sorted part at the start of the list. It is good for small or nearly sorted lists."], ["Which sort is generally fastest for large lists?", "Merge sort."], ["What is nesting?", "Putting one structure inside another, such as a selection inside an iteration."]], [["Computational thinking", ["Abstraction: remove unnecessary detail.", "Decomposition: break a problem into smaller parts.", "Algorithmic thinking: work out the steps to solve it."]], ["Representing algorithms", ["Structure diagrams show a problem broken into parts.", "Flowcharts: oval start and end, rectangle process, diamond decision, parallelogram input and output.", "Pseudocode: programming-like statements, not tied to any one language.", "Trace tables record variable values step by step to find errors."]], ["Errors", ["Syntax error: breaks the language rules, the program will not run.", "Logic error: the program runs but gives the wrong result."]], ["Searching", ["Linear search: check each item in order. Works on unsorted data, slow on big lists.", "Binary search: needs sorted data. Check the middle and discard half each time."]], ["Sorting", ["Bubble sort: swap adjacent pairs, repeat until no swaps.", "Merge sort: split into single items, then merge in order. Fast but uses more memory.", "Insertion sort: insert each item into its place in the sorted section."]]]], ["2.2 Programming fundamentals", [["What is the difference between a variable and a constant?", "A variable's value can change while the program runs. A constant's value is fixed."], ["What is assignment?", "Giving a variable a value, for example x = 5."], ["What are the three basic programming constructs?", "Sequence, selection and iteration."], ["What is selection?", "Choosing which code runs depending on a condition, using if, else and switch statements."], ["What is count-controlled iteration?", "A loop that repeats a set number of times, such as a for loop."], ["What is condition-controlled iteration?", "A loop that repeats until a condition is met, such as while or do until. A while loop may run zero times, a do until loop runs at least once."], ["What do MOD and DIV do? Work out 17 MOD 5 and 17 DIV 5.", "MOD gives the remainder and DIV gives the whole number part of a division. 17 MOD 5 = 2 and 17 DIV 5 = 3."], ["What are the comparison operators?", "== equal to, != not equal to, < less than, <= less than or equal to, > greater than, >= greater than or equal to."], ["What do the Boolean operators AND, OR and NOT do in a condition?", "AND needs both parts to be true. OR needs at least one part true. NOT reverses the result."], ["Name the five data types.", "Integer (whole number), real (decimal), Boolean (True or False), character (one symbol) and string (text)."], ["What is casting?", "Converting a value from one data type to another, for example turning the string '5' into the integer 5."], ["What is string manipulation?", "Working with text, such as finding its length, taking part of it (a substring), joining strings (concatenation) or changing case."], ["What are the steps of file handling?", "Open the file, read or write, then close it. Closing stops data being lost or corrupted."], ["What is a record?", "A collection of fields about one thing, which can have different data types. It is like one row in a table."], ["What does SQL SELECT do?", "It searches a database. For example: SELECT name FROM students WHERE age > 15. A * means all fields."], ["What is a 1D array?", "A fixed-size list of items of the same data type, each reached using an index that starts at 0."], ["What is a 2D array?", "A grid of items, like a table, where each item is reached using two indexes: row and column."], ["What is a sub program?", "A named block of code that can be called when needed. It cuts repetition and makes code easier to test and maintain."], ["What is the difference between a function and a procedure?", "A function returns a value. A procedure does not."], ["What is a parameter?", "A value passed into a sub program when it is called."], ["What is the difference between local and global variables?", "A local variable can only be used inside the sub program it is declared in. A global variable can be used anywhere in the program."], ["Why would a program use random number generation?", "To make results unpredictable, such as rolling a dice in a game or picking a random question."]], [["Basics", ["Variables change while running. Constants do not.", "Assignment gives a variable a value.", "Sequence, selection and iteration are the three constructs.", "Count-controlled loops repeat a set number of times. Condition-controlled loops repeat until a condition is met."]], ["Operators", ["Arithmetic: +, -, *, /, MOD (remainder), DIV (whole number part), ^ (power).", "Comparison: ==, !=, <, <=, >, >=.", "Boolean: AND, OR, NOT."]], ["Data types", ["Integer, real, Boolean, character and string.", "Casting converts between types."]], ["Data structures and files", ["1D array: a list reached by an index starting at 0.", "2D array: a grid reached by row and column.", "Record: fields about one thing, of different types.", "File handling: open, read or write, then close.", "SQL: SELECT fields FROM table WHERE condition."]], ["Sub programs", ["A named block of code that you can call.", "Function returns a value. Procedure does not.", "Parameters pass values in.", "Local variables work only inside, global variables anywhere."]]]], ["2.3 Producing robust programs", [["What is defensive design?", "Planning for how a program might be misused or go wrong, and writing it so that it still works safely."], ["What is authentication?", "Checking that a user is who they say they are, for example with a username and password."], ["What is input validation?", "Checking that the data entered is reasonable before it is used. It does not prove the data is correct."], ["Name some types of validation check.", "Range check, length check, type check, presence check and format check."], ["What is the difference between validation and verification?", "Validation checks data is reasonable. Verification checks it was entered correctly, for example by typing it twice."], ["What makes a program maintainable?", "Using sub programs, sensible naming conventions, indentation and comments, so other programmers can understand and update it."], ["Why add comments to code?", "To explain what the code does so that it is easier to understand and maintain."], ["What is the purpose of testing?", "To check the program works, find errors and make sure it meets the requirements."], ["What is the difference between iterative and final testing?", "Iterative testing happens during development, checking each part as it is written. Final testing checks the whole program at the end against the requirements."], ["What is normal test data?", "Valid data that the program should accept, such as 5 for a number between 1 and 10."], ["What is boundary test data?", "Data at the very edge of what is allowed, such as 1 and 10 for a range of 1 to 10, along with values just outside it, such as 0 and 11."], ["What is invalid test data?", "Data of the right type that the program should reject, such as 15 for a range of 1 to 10."], ["What is erroneous test data?", "Data of the wrong type, which the program should reject, such as the word five when a number is expected."], ["Why refine an algorithm after testing?", "To fix errors and improve it, so it works correctly and efficiently."]], [["Defensive design", ["Plan for misuse and write the program so that it still works safely.", "Authentication: username and password to check who the user is.", "Input validation: range, length, type, presence and format checks.", "Verification checks data was entered correctly, for example typing it twice."]], ["Maintainability", ["Sub programs, naming conventions, indentation and comments.", "These make code easier to understand, test and update."]], ["Testing", ["Iterative testing: during development.", "Final testing: the whole program against the requirements.", "Test data: normal, boundary, invalid and erroneous.", "Refine the algorithm after testing."]]]], ["2.4 Boolean logic", [["What is the output of an AND gate?", "1 only when both inputs are 1. Otherwise it is 0."], ["What is the output of an OR gate?", "1 when at least one input is 1. It is 0 only when both are 0."], ["What does a NOT gate do?", "It reverses the input. A 1 becomes 0 and a 0 becomes 1."], ["How many rows does a truth table need for 3 inputs?", "8 rows (2 to the power of 3)."], ["Work out Q = A AND (NOT B) when A = 1 and B = 0.", "NOT B is 1, so Q = 1 AND 1 = 1."], ["When is P = (A OR B) AND C equal to 1?", "When C is 1 and at least one of A or B is 1."], ["What is a truth table?", "A table that shows the output for every possible combination of inputs."], ["What is a logic diagram?", "A drawing that uses gate symbols (AND, OR, NOT) joined together to show a logic expression."]], [["Logic gates", ["AND: output 1 only if both inputs are 1.", "OR: output 1 if at least one input is 1.", "NOT: reverses the input.", "A truth table lists the output for every combination of inputs. n inputs gives 2 to the power n rows."]], ["Working it out", ["Work through brackets and NOT first, then AND, then OR.", "Combine gates in a logic diagram or an expression such as Q = A AND (NOT B).", "Use a truth table to check each row."]]]], ["2.5 Programming languages and IDEs", [["What is a high-level language?", "A language close to human language that is easier to read, write and debug, and works on different machines. One statement becomes many machine code instructions."], ["What is a low-level language?", "A language close to machine code, such as assembly language or machine code. It is hardware specific and harder to write, but gives more control and can be very efficient."], ["What is machine code?", "Binary instructions that the CPU can run directly."], ["Why are translators needed?", "The CPU only understands machine code, so translators convert source code into machine code."], ["What does a compiler do?", "It translates the whole program into machine code at once, giving an executable file. The program then runs quickly and the source code is not needed."], ["What does an interpreter do?", "It translates and runs the program one line at a time. It stops at the first error, which makes debugging easier, but the program runs more slowly."], ["What does an assembler do?", "It translates assembly language into machine code."], ["Compare a compiler and an interpreter.", "A compiler translates everything first, so it runs faster and reports errors after compiling. An interpreter translates line by line, so it is slower but easier to test and debug."], ["What is an IDE?", "An integrated development environment, a program with the tools to write, test and debug code in one place."], ["What does an IDE editor provide?", "Tools such as syntax highlighting, auto-complete and automatic indentation that help to write code."], ["What are error diagnostics in an IDE?", "Tools that find errors and tell you what and where they are, such as the line number."], ["What is a run-time environment in an IDE?", "A way of running and testing the program inside the IDE."]], [["Types of language", ["High-level: close to human language, easier to read, write and debug, works across machines.", "Low-level: machine code and assembly language. Hardware specific and harder to write, but efficient with more control."]], ["Translators", ["Machine code is the only language the CPU understands.", "Compiler: translates the whole program at once. Fast to run, no source needed.", "Interpreter: translates and runs line by line. Easier to debug but slower.", "Assembler: translates assembly language."]], ["IDEs", ["An IDE puts the tools for writing, testing and debugging in one place.", "Editor: highlighting, auto-complete and indentation.", "Error diagnostics: find and report errors.", "Run-time environment: run and test the program.", "Translator: compiles or interprets the code."]]]]];
  var QUIZ = [["1.1 Systems architecture", "Which register holds the address of the next instruction to be fetched?", ["Program counter", "MAR", "MDR", "Accumulator"], "The program counter holds the address of the next instruction and goes up by one after each fetch."], ["1.1 Systems architecture", "What does the ALU do?", ["Carries out arithmetic and logic operations", "Decodes instructions", "Stores frequently used data", "Sends data to the printer"], "The ALU does calculations, logic operations and comparisons. The control unit does the decoding."], ["1.1 Systems architecture", "What is the correct order of the fetch-decode-execute cycle?", ["Fetch, decode, execute", "Decode, fetch, execute", "Execute, fetch, decode", "Fetch, execute, decode"], "An instruction is fetched from memory, decoded by the control unit, then executed."], ["1.1 Systems architecture", "Which change helps a CPU run more tasks at the same time?", ["Adding more cores", "Reducing the cache size", "Lowering the clock speed", "Adding more ROM"], "Each core can process instructions at the same time, as long as the software can use them."], ["1.1 Systems architecture", "Which of these is an embedded system?", ["A microwave oven controller", "A laptop", "A desktop PC", "A web server"], "An embedded system sits inside a larger device and does one dedicated job."], ["1.1 Systems architecture", "In Von Neumann architecture, where are data and instructions stored?", ["In the same main memory", "In two separate memories", "Only in cache", "Only in registers"], "Von Neumann architecture stores data and instructions together in main memory."], ["1.2 Memory and storage", "Which of these is volatile?", ["RAM", "ROM", "A solid state drive", "A hard disk drive"], "Volatile memory loses its contents when the power is off. RAM is volatile."], ["1.2 Memory and storage", "What is virtual memory?", ["Part of secondary storage used as extra RAM when RAM is full", "Extra cache inside the CPU", "A type of ROM", "Memory on a graphics card"], "Data not needed right now is swapped out to secondary storage. It is slower than real RAM."], ["1.2 Memory and storage", "What is the denary value of the binary number 00101101?", ["45", "43", "53", "35"], "32 + 8 + 4 + 1 = 45."], ["1.2 Memory and storage", "What is 1011 + 0110 in binary?", ["10001", "10101", "1111", "10011"], "1011 is 11 and 0110 is 6. 11 + 6 = 17, which is 10001. In a 4-bit system that would overflow."], ["1.2 Memory and storage", "Which hexadecimal value is the same as the binary number 10111110?", ["BE", "EB", "AE", "B6"], "Split into nibbles: 1011 is B and 1110 is E."], ["1.2 Memory and storage", "An image is 100 pixels wide and 50 pixels high with a colour depth of 8 bits. How big is it in bits?", ["40,000", "5,000", "4,000", "400,000"], "Size = colour depth x width x height = 8 x 100 x 50 = 40,000 bits."], ["1.2 Memory and storage", "What does lossy compression do?", ["Permanently removes some data to make the file smaller", "Removes data but can restore it exactly", "Makes the file bigger", "Only works on text files"], "Lossy compression cannot be undone. JPEG and MP3 are examples."], ["1.2 Memory and storage", "What does a binary left shift by 2 places do to a number?", ["Multiplies it by 4", "Divides it by 4", "Multiplies it by 2", "Adds 2 to it"], "Each place shifted left multiplies by 2, so two places multiplies by 4."], ["1.3 Networks, connections and protocols", "Which device sends data only to the device it is meant for on a LAN?", ["Switch", "Router", "Wireless access point", "NIC"], "A switch forwards data to the intended device. A router connects different networks."], ["1.3 Networks, connections and protocols", "What does DNS do?", ["Turns domain names into IP addresses", "Encrypts web traffic", "Sends email", "Assigns MAC addresses"], "DNS servers look up the IP address for a domain name such as bbc.co.uk."], ["1.3 Networks, connections and protocols", "Which protocol is used to send email?", ["SMTP", "POP", "IMAP", "FTP"], "SMTP sends email. POP and IMAP are used to retrieve it."], ["1.3 Networks, connections and protocols", "What is a disadvantage of a star topology?", ["If the central switch fails, the whole network goes down", "It needs a cable between every pair of devices", "One failed cable stops every device", "It cannot have more than three devices"], "Every device connects through the central switch, so it is a single point of failure."], ["1.3 Networks, connections and protocols", "Which address is fixed and built into the NIC when it is made?", ["MAC address", "IP address", "URL", "Domain name"], "A MAC address is a hardware address. An IP address can change."], ["1.3 Networks, connections and protocols", "Which protocol is the secure version of HTTP?", ["HTTPS", "FTP", "SMTP", "TCP"], "HTTPS encrypts the data sent between the browser and the web server."], ["1.3 Networks, connections and protocols", "What is an advantage of a client-server network?", ["Files and security are managed centrally", "There is no single point of failure", "It is cheap to set up", "It works without a server"], "A central server makes backup and security easier, but it costs more and is a single point of failure."], ["1.4 Network security", "What is phishing?", ["Fake messages that trick people into giving away personal details", "Flooding a server with requests", "Trying every possible password", "Typing SQL code into an input box"], "Phishing is a form of social engineering, often using fake emails or websites."], ["1.4 Network security", "Which attack tries every possible password combination?", ["Brute force", "Denial of service", "SQL injection", "Phishing"], "Long, complex passwords take much longer to brute force."], ["1.4 Network security", "What does a firewall do?", ["Checks network traffic against rules and blocks unauthorised traffic", "Scrambles stored data", "Removes viruses from files", "Backs up files"], "A firewall monitors traffic going in and out of a networ   /* ---------- views ---------- */

        '<h2 class="hero">Ready?</h2><p class="big">' + total + (total === 1 ? ' card' : ' cards') + ' in this run. Try to answer in your head before you flip each one.</p>' +

    cards = cards.filter(function (c) { return !c.ex; });
    var have = {};
    cards.forEach(function (c) { have[c.q] = 1; });
    ocr().forEach(function (c) { if (!have[c.q]) cards.push(c); });
    try { localStorage.setItem(KEY + '.seed', 'ocr2'); } catch (e) {}
  }
  save(); buildQueue(); render();
})();
</script>
