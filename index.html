<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Recall Deck - OCR GCSE Computer Science</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <style>
    :root {
      --bg: #0d1318;
      --surface: #141c24;
      --surface-card: #19232c;
      --ink: #e8edf0;
      --muted: #8a9ba8;
      --line: #24323e;
      --accent: #00c896;
      --accent-ink: #0d1318;
      --good: #4fc596;
      --bad: #f0707a;
      --track: #26333d;
      --display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
      --body: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
      --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
    }
    :root[data-theme="light"] {
      --bg: #eceff1;
      --surface: #fbfcfc;
      --surface-card: #ffffff;
      --ink: #15212b;
      --muted: #5b6874;
      --line: #d0d7dc;
      --accent: #a8480c;
      --accent-ink: #ffffff;
      --good: #17744f;
      --bad: #b4262f;
      --track: #dde3e7;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5;
      padding: 24px 16px 48px;
    }
    .wrap { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
    
    .top-box {
      background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    }
    .brand h1 { font-family: var(--display); font-weight: 700; font-size: 1.8rem; letter-spacing: -0.02em; margin: 0; }
    .brand .sub { font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.05em; color: var(--muted); text-transform: uppercase; margin-top: 4px; display: block; }
    
    .header-controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    
    .pill-picker { display: flex; background: var(--bg); border: 1px solid var(--line); border-radius: 30px; padding: 4px; gap: 4px; }
    .pill-btn {
      font-family: var(--body); font-size: 0.85rem; padding: 6px 14px; border-radius: 20px;
      border: 0; background: transparent; color: var(--muted); cursor: pointer; transition: all 0.2s;
    }
    .pill-btn.active { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

    .mode-btn {
      font-family: var(--body); font-size: 0.85rem; padding: 8px 14px; border-radius: 20px;
      border: 1px solid var(--line); background: var(--bg); color: var(--muted); cursor: pointer;
    }
    .mode-btn:hover { border-color: var(--accent); color: var(--ink); }

    .nav-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--line); padding-bottom: 2px; flex-wrap: wrap;
    }
    .tabs { display: flex; gap: 4px; overflow-x: auto; }
    .tabs button {
      background: none; border: 0; border-bottom: 3px solid transparent; color: var(--muted);
      font: 500 0.95rem var(--body); padding: 10px 14px 9px; cursor: pointer; white-space: nowrap;
    }
    .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

    .unit-select-wrap { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 0.75rem; color: var(--muted); text-transform: uppercase; }
    select {
      font: 400 0.85rem var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line);
      border-radius: 6px; padding: 6px 10px; cursor: pointer; max-width: 280px;
    }

    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 18px; }
    .unit-title-header { font-family: var(--display); font-size: 1.4rem; color: var(--accent); margin: 0 0 8px; display: flex; justify-content: space-between; align-items: baseline; }
    .unit-sub-tag { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); font-weight: 400; text-transform: uppercase; }

    .cognito-card {
      background: var(--surface-card); border: 1px solid var(--line); border-left: 4px solid var(--accent);
      border-radius: 8px; padding: 20px; display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px;
    }
    .cognito-card h3 { font-family: var(--display); font-size: 1.1rem; margin: 0; color: var(--ink); }
    .cognito-card p { margin: 0; font-size: 0.95rem; color: var(--ink); line-height: 1.6; }
    .cognito-card ul { margin: 4px 0 0; padding-left: 1.2em; color: var(--muted); font-size: 0.92rem; display: flex; flex-direction: column; gap: 6px; }

    .flashcard {
      background: var(--surface-card); border: 1px solid var(--line); border-radius: 8px; padding: 32px 24px;
      min-height: 280px; display: flex; flex-direction: column; gap: 18px; cursor: pointer; user-select: none;
    }
    .topic-tag { font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
    .q-text { font-family: var(--display); font-weight: 500; font-size: 1.35rem; line-height: 1.3; margin: 0; }
    .ans-text { border-top: 1px dashed var(--line); padding-top: 16px; font-size: 1.05rem; color: var(--ink); }
    .card-hint { margin-top: auto; font-size: 0.82rem; color: var(--muted); }
    
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn {
      font: 600 1rem var(--body); padding: 12px 16px; border-radius: 6px; border: 1px solid var(--line);
      background: var(--surface-card); color: var(--ink); cursor: pointer; text-align: center;
    }
    .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .btn.miss { color: var(--bad); border-color: var(--bad); }
    .btn.hit { color: var(--good); border-color: var(--good); }

    .opts { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .opt { display: flex; gap: 10px; text-align: left; width: 100%; font: 400 0.95rem var(--body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 12px; cursor: pointer; }
    .opt:hover:not(:disabled) { border-color: var(--accent); }
    .opt.right { border-color: var(--good); background: rgba(79, 197, 150, 0.1); }
    .opt.wrong { border-color: var(--bad); background: rgba(240, 112, 122, 0.1); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top-box">
      <div class="brand">
        <h1>Recall Deck</h1>
        <span class="sub">OCR GCSE Computer Science (J277)</span>
      </div>
      <div class="header-controls">
        <div class="pill-picker" id="subjects"></div>
        <button class="mode-btn" onclick="toggleTheme()" id="themeBtn">Light Mode</button>
      </div>
    </div>

    <div class="nav-bar">
      <nav class="tabs" id="tabs"></nav>
      <div class="unit-select-wrap">
        <span>Unit:</span>
        <select id="unitSelect" onchange="setUnit(this.value)"></select>
      </div>
    </div>

    <main id="view"></main>
  </div>

  <script>
    (function () {
      var currentSubj = 'comp1';
      var currentUnit = 'all';

      var theme = 'dark';

      var DATA = {
        comp1: {
          title: "Component 1: Computer Systems",

            {
              id: "c1_1",
              name: "1.1 Systems Architecture",
              notes: [
                { t: "The Central Processing Unit (CPU) Architecture", content: "The CPU fetches, decodes, and executes instructions to process data.", points: ["Arithmetic Logic Unit (ALU): Executes arithmetic operations (+, -, *, /) and logical comparisons (AND, OR, NOT, <, >, =).", "Control Unit (CU): Coordinates the F-D-E cycle, decodes machine instructions, and sends control signals along buses.", "Cache Memory: Small, extremely fast static RAM located on or very close to the CPU chip, storing frequently used data/instructions to minimize slow RAM access delays.", "Registers: Tiny, lightning-fast storage locations inside the CPU holding data currently being processed."] },
                { t: "Von Neumann Architecture & Registers", content: "Von Neumann architecture stores both program instructions and data together in the same primary memory storage.", points: ["Memory Address Register (MAR): Holds the memory address of the instruction or data currently needed to be read from or written to.", "Memory Data Register (MDR): Holds the actual data or instruction fetched from memory, or waiting to be written.", "Program Counter (PC): Holds the exact memory address of the very next instruction to be fetched.", "Accumulator (ACC): Temporarily stores the intermediate results of ALU calculations."] },
                { t: "CPU Performance Factors", content: "Three core hardware factors dictate overall microprocessor performance and throughput.", points: ["Clock Speed: Measured in Gigahertz (GHz), representing billions of processing cycles per second. Higher clock speed means faster instruction execution.", "Cache Size: Larger cache capacity holds more active instructions locally, reducing latency caused by fetching from main memory.", "Number of Cores: Multi-core processors allow independent tasks or parallelized threads to run simultaneously, multiplying processing capability if software supports it."] }
              ],
              cards: [
                { q: "What is the function of the Program Counter (PC)?", a: "It stores the memory address of the next instruction to be fetched during the F-D-E cycle." },
                { q: "What does von Neumann architecture store in main memory?", a: "Both program instructions and data share the same unified main memory space." }
              ],
              quiz: [
                { q: "Which CPU component carries out arithmetic operations and logical comparisons?", opts: ["Control Unit", "Cache", "ALU", "MAR"], ans: 2 },
                { q: "What is the main role of the Control Unit (CU)?", opts: ["Perform addition and subtraction", "Coordinate the F-D-E cycle and decode instructions", "Hold intermediate ALU results", "Store boot-up instructions"], ans: 1 },
                { q: "Where is Cache memory located relative to the CPU?", opts: ["On a remote cloud server", "Inside secondary solid state storage", "On or very close to the CPU chip", "Inside the optical drive"], ans: 2 },
                { q: "Why is Cache memory used?", opts: ["To permanently save files when power is cut", "To store frequently used data/instructions and reduce RAM latency", "To increase physical screen resolution", "To generate random encryption keys"], ans: 1 },
                { q: "What defines Von Neumann Architecture?", opts: ["Data and instructions are stored in separate memory chips", "Data and instructions share the same primary memory storage", "The CPU operates without registers", "Processing occurs exclusively in ROM"], ans: 1 },
                { q: "Which register holds the memory address of data about to be read or written?", opts: ["MDR", "PC", "MAR", "ACC"], ans: 2 },
                { q: "Which register holds the actual data or instruction fetched from memory?", opts: ["MAR", "MDR", "PC", "ALU"], ans: 1 },
                { q: "What is stored inside the Program Counter (PC)?", opts: ["The memory address of the NEXT instruction to be fetched", "The output of an AND logic operation", "The current clock frequency in GHz", "The total size of physical RAM"], ans: 0 },
                { q: "What does the Accumulator (ACC) temporarily hold?", opts: ["Unread network data packets", "The intermediate results of ALU calculations", "Deleted browser history", "Device driver configuration settings"], ans: 1 },
                { q: "How is Clock Speed measured?", opts: ["Megabytes (MB)", "Gigahertz (GHz)", "Bits per second (bps)", "Pixels per inch"], ans: 1 },
                { q: "What does 1 Hertz (Hz) represent in clock speed?", opts: ["1 byte of memory", "1 processing cycle per second", "1 megabit of data", "1 pixel render"], ans: 1 },
                { q: "How does having multiple CPU cores improve processing capability?", opts: ["It doubles the speed of light", "It allows independent tasks or parallelized threads to run simultaneously", "It replaces the need for RAM", "It prevents malware infections"], ans: 1 },
                { q: "What is a limitation of multi-core processors?", opts: ["They cannot process integers", "Software must be specially designed to support parallel processing", "They erase cache memory every 5 seconds", "They only work with optical drives"], ans: 1 },
                { q: "What is a register?", opts: ["A large magnetic storage disk", "A tiny, lightning-fast internal CPU storage location", "A type of network cable", "An external flash memory drive"], ans: 1 },
                { q: "Which sequence correctly orders the CPU cycle?", opts: ["Decode -> Fetch -> Execute", "Fetch -> Decode -> Execute", "Execute -> Fetch -> Decode", "Store -> Fetch -> Delete"], ans: 1 }
              ]
            },
            {
              id: "c1_2",
              name: "1.2 Memory and Storage",
              notes: [
                { t: "Primary Storage (RAM & ROM)", content: "Primary storage is directly accessible by the CPU, essential for running active applications.", points: ["RAM (Random Access Memory): Volatile primary storage holding open applications, files, and parts of the OS currently in use. Data is lost when power is cut.", "ROM (Read-Only Memory): Non-volatile memory containing immutable boot-up code (BIOS/firmware) needed to initialize hardware upon startup.", "Virtual Memory: A designated portion of secondary storage utilized as overflow RAM when physical RAM is fully saturated. Slower due to disk read/write latency."] },
                { t: "Secondary Storage & Data Units", content: "Secondary storage provides non-volatile, permanent retention of programs and files.", points: ["Storage Media Types: Magnetic (HDDs using magnetic platters), Optical (CD/DVD/Blu-ray using lasers), and Solid State (SSDs using flash memory chips; fast, durable, silent).", "Data Storage Units: Bit (0 or 1), Nibble (4 bits), Byte (8 bits), Kilobyte (1,000 bytes), Megabyte, Gigabyte, Terabyte, Petabyte.", "File Calculations: Image size = Width × Height × Colour depth (bits). Sound size = Sample rate × Bit depth × Duration (seconds)."] }
              ],
              cards: [
                { q: "What is the difference between volatile and non-volatile memory?", a: "Volatile memory loses its contents when power is turned off (e.g. RAM); non-volatile memory retains data permanently (e.g. ROM, SSDs)." }
              ],
              quiz: [
                { q: "Why is RAM classified as volatile memory?", opts: ["It cannot be rewritten", "Its contents are lost when power is disconnected", "It uses magnetic platters", "It is located outside the motherboard"], ans: 1 },
                { q: "What is stored in ROM according to the notes?", opts: ["Open browser tabs", "Immutable boot-up code (BIOS/firmware)", "Temporary graphics cache", "User text documents"], ans: 1 },
                { q: "When is Virtual Memory used?", opts: ["When the CPU clock speed drops", "When physical RAM is fully saturated, using secondary storage as overflow", "Whenever an email is sent", "To clean up hard drive sectors"], ans: 1 },
                { q: "Why is Virtual Memory slower than physical RAM?", opts: ["Secondary storage read/write speeds are much slower than RAM", "It relies on wireless radio waves", "It can only process 1 bit per minute", "It requires user permission for every byte"], ans: 0 },
                { q: "Which storage type uses magnetic platters?", opts: ["Solid State Drive (SSD)", "Hard Disk Drive (HDD)", "Optical Blu-ray", "USB Flash Drive"], ans: 1 },

                { q: "What makes Solid State Drives (SSDs) durable and fast?", opts: ["They contain high-speed spinning disks", "They use flash memory chips with no moving mechanical parts", "They use liquid cooling", "They are powered by lasers"], ans: 1 },
                { q: "How many bits make up a single Nibble?", opts: ["2", "4", "8", "16"], ans: 1 },
                { q: "How many bits are in a Byte?", opts: ["4", "8", "16", "1024"], ans: 1 },
                { q: "What unit comes immediately after Megabyte (MB) in data capacity scale?", opts: ["Kilobyte (KB)", "Gigabyte (GB)", "Terabyte (TB)", "Petabyte (PB)"], ans: 1 },
                { q: "How many Bytes are in 1 Kilobyte (KB) in standard metric notation?", opts: ["8", "100", "1,000", "1,000,000"], ans: 2 },
                { q: "What formula calculates the uncompressed file size of a digital image in bits?", opts: ["Width × Height × Colour depth", "Sample rate × Duration × Bit depth", "Width × Length × Resolution", "Height × Bytes × 8"], ans: 0 },
                { q: "What formula calculates the file size of a sound recording?", opts: ["Width × Height × Sample rate", "Sample rate × Bit depth × Duration (seconds)", "Bit depth × Volume × Channels", "Sample rate × Resolution"], ans: 1 },
                { q: "What happens to the contents of ROM when power is turned off?", opts: ["They are deleted completely", "They are retained (non-volatile)", "They are transferred to RAM", "They are backed up online"], ans: 1 },
                { q: "Why do computers require secondary storage in addition to primary storage?", opts: ["Primary storage is non-volatile", "To provide non-volatile, permanent storage for files and programs", "To speed up the ALU", "Because RAM has infinite capacity"], ans: 1 }
              ]
            },
            {
              id: "c1_3",
              name: "1.3 Networks, Connections & Protocols",
              notes: [
                { t: "Network Topologies & Hardware", content: "Networks connect computers to share hardware peripherals, data, and communication channels.", points: ["LAN vs WAN: Local Area Networks cover small geographical sites under single ownership; Wide Area Networks connect distant LANs using leased telecommunication lines (e.g., The Internet).", "Star Topology: Every device connects independently to a central switch or server. Robust against individual cable failure, but the central switch is a single point of failure.", "Hardware Components: Router (directs packets between distinct networks), Switch (directs frames within a LAN), WAP (wireless access point), NIC (Network Interface Card providing physical/wireless connection)."] },
                { t: "IP/MAC Addressing & Protocols", content: "Data transmission relies on strict standardized rules (protocols) and unique addressing schemes.", points: ["IP Address: Logical, hierarchical address assigned dynamically to devices on a network (IPv4 or IPv6) for routing packets across WANs.", "MAC Address: Unique physical hardware identifier burned into the NIC during manufacturing, operating at the data link layer.", "TCP/IP Protocol Suite: TCP splits data into numbered packets and handles error checking/reassembly; IP routes packets across networks.", "Web & Email Protocols: HTTP/HTTPS (web browsing, HTTPS uses TLS/SSL encryption), FTP (file transfers), SMTP (sending email), IMAP/POP3 (retrieving email)."] }
              ],
              cards: [
                { q: "What is the key difference between an IP address and a MAC address?", a: "An IP address is logical and changes depending on network location; a MAC address is a permanent physical hardware identifier burned into the NIC." }
              ],
              quiz: [
                { q: "What defines a Local Area Network (LAN)?", opts: ["Covers global continents using satellite links", "Covers a small geographical site under single organisation ownership", "Uses leased public telephone lines exclusively", "Is owned entirely by internet service providers"], ans: 1 },
                { q: "What is the largest example of a Wide Area Network (WAN)?", opts: ["A school computer lab", "The Internet", "A home Wi-Fi network", "A Bluetooth connection"], ans: 1 },
                { q: "In a Star Topology, what happens if a single client cable breaks?", opts: ["The entire network fails", "Only that specific client device loses connection", "The central switch crashes", "Traffic switches automatically to Bluetooth"], ans: 1 },
                { q: "What is a main vulnerability of a Star Topology?", opts: ["Individual cables break easily", "The central switch/server is a single point of failure", "Wireless signals cannot reach it", "It cannot connect to the internet"], ans: 1 },
                { q: "What is the primary function of a Router?", opts: ["Directs data frames within a local LAN", "Directs data packets between distinct, different networks", "Prints hard copies of web pages", "Encodes digital video files"], ans: 1 },
                { q: "What is the function of a Network Interface Card (NIC)?", opts: ["Stores BIOS boot instructions", "Provides a physical or wireless connection between a device and a network", "Increases CPU clock speed", "Defragments magnetic drives"], ans: 1 },
                { q: "What type of address is a MAC address?", opts: ["A logical address assigned dynamically by routers", "A unique physical hardware identifier burned into the NIC", "A web domain name like google.com", "A 32-bit email protocol code"], ans: 1 },
                { q: "How do IP addresses differ from MAC addresses?", opts: ["IP addresses are permanent hardware IDs", "IP addresses are logical and can change depending on network location", "MAC addresses change every time you reboot", "IP addresses are only used for printers"], ans: 1 },

                { q: "What role does IP perform in the TCP/IP suite?", opts: ["Formats text documents", "Routes data packets across networks to their destination address", "Manages CPU registers", "Connects Bluetooth devices"], ans: 1 },

                { q: "What added security does HTTPS use compared to HTTP?", opts: ["MAC filtering", "TLS/SSL encryption", "Defragmentation", "Input sanitation"], ans: 1 },
                { q: "Which protocol is designed specifically for transferring files across networks?", opts: ["FTP", "SMTP", "IMAP", "POP3"], ans: 0 },
                { q: "Which email protocol is used to SEND messages to a server?", opts: ["POP3", "IMAP", "SMTP", "HTTP"], ans: 2 },
                { q: "How does IMAP differ from POP3 for email retrieval?", opts: ["IMAP deletes emails from the server after download", "IMAP keeps emails on the central server so they sync across devices", "IMAP only works without internet", "POP3 encrypts all attachments automatically"], ans: 1 }
              ]
            },

                { t: "Defensive Measures & Prevention", content: "Robust security frameworks protect enterprise infrastructure from compromise.", points: ["Penetration Testing: Authorized simulated attacks conducted by ethical hackers to identify system vulnerabilities before malicious actors do.", "Firewalls: Hardware or software inspecting incoming and outgoing packet headers against preset security rules.", "User Access Levels: Restricting file permissions so users can only access data necessary for their specific job role.", "Encryption: Scrambling plain text into ciphertext using cryptographic keys, rendering intercepted data unreadable without the decryption key."] }
              ],
              cards: [
                { q: "What is phishing?", a: "A social engineering technique where attackers trick individuals into revealing sensitive data via deceptive emails or websites." }
              ],
              quiz: [
                { q: "How is a Virus defined in the security notes?", opts: ["Self-replicating software that spreads without host files", "Malware that attaches to host files and requires user execution to spread", "Software disguised as a legitimate tool", "An authorized security audit test"], ans: 1 },
                { q: "How does a Worm differ from a Virus?", opts: ["A worm encrypts files for money", "A worm self-replicates across networks without needing a user to run an infected file", "A worm is harmless", "A worm only targets MAC addresses"], ans: 1 },

                { q: "What is Spyware?", opts: ["Software that secretly records user activity (e.g. keystrokes) and sends it to an attacker", "A network switch configuration", "An open source browser", "A tool for defragmenting disks"], ans: 0 },

                { q: "How does a Brute-Force attack operate?", opts: ["Injecting SQL code into search bars", "Using automated scripts to test every possible password combination until correct", "Sending physical malware in the post", "Intercepting wireless radio waves"], ans: 1 },

            },
            {

              name: "1.5 Systems Software",
              notes: [
                { t: "Operating Systems & Utility Software", content: "Systems software provides a stable platform for application execution and hardware management.", points: ["Operating System (OS) Core Functions: User interface (CLI/GUI), memory management, multitasking (CPU scheduling), peripheral device management, file management, and user security/access control.", "Device Drivers: Specialized software acting as a translator between the operating system and specific peripheral hardware devices.", "Utility Software: Maintenance tools including disk defragmentation (reorganizing fragmented magnetic sectors for faster read speeds), automated backups, compression utilities, and anti-malware scanners."] }

        currentSubj = s;
        currentUnit = 'all';
        qIdx = 0; quizIdx = 0; quizSelected = null; quizScore = 0; flipped = false;
        render();
      };

      window.setUnit = function (u) {
        currentUnit = u;
        qIdx = 0; quizIdx = 0; quizSelected = null; quizScore = 0; flipped = false;
        render();
      };

      window.setTab = function (t) {
        tab = t;
        flipped = false;
        render();
      };

      function getFilteredUnits() {
        var units = DATA[currentSubj].units;
        if (currentUnit === 'all') return units;
        return units.filter(function (u) { return u.id === currentUnit; });
      }

      function getCards() {
        var list = [];
        getFilteredUnits().forEach(function (u) {
          u.cards.forEach(function (c) {
            list.push({ topic: u.name, q: c.q, a: c.a });
          });
        });
        return list;
      }

      function getQuiz() {
        var list = [];
        getFilteredUnits().forEach(function (u) {
          u.quiz.forEach(function (q) {
            list.push({ topic: u.name, q: q.q, opts: q.opts, ans: q.ans });
          });
        });
        return list;
      }

      function renderNotes() {
        var html = '<div class="panel">';
        html += '<h2 style="font-family:var(--display); font-size:1.3rem; margin:0;">' + DATA[currentSubj].title + ' — Comprehensive Revision Guide</h2>';
        getFilteredUnits().forEach(function (u) {
          html += '<div style="margin-top:20px;">';
          html += '<div class="unit-title-header"><span>' + u.name + '</span><span class="unit-sub-tag">OCR GCSE J277</span></div>';
          u.notes.forEach(function (n) {
            html += '<div class="cognito-card">';
            html += '<h3>' + n.t + '</h3>';
            html += '<p>' + n.content + '</p>';
            if (n.points && n.points.length) {
              html += '<ul>';
              n.points.forEach(function (pt) {
                html += '<li>' + pt + '</li>';
              });
              html += '</ul>';
            }
            html += '</div>';
          });
          html += '</div>';
        });
        html += '</div>';
        return html;
      }

      function renderStudy() {
        var cards = getCards();
        if (cards.length === 0) return '<div class="panel">No flashcards available for this unit.</div>';
        var c = cards[qIdx % cards.length];
        var html = '<div class="flashcard" onclick="flipCard()">';
        html += '<div class="topic-tag"><span>' + c.topic + '</span><span>Card ' + (qIdx + 1) + ' / ' + cards.length + '</span></div>';
        html += '<div class="q-text">' + c.q + '</div>';
        if (flipped) {
          html += '<div class="ans-text">' + c.a + '</div>';
        } else {
          html += '<div class="card-hint">Click card to reveal detailed answer</div>';
        }
        html += '</div>';
        html += '<div class="actions">';
        html += '<button class="btn miss" onclick="nextCard(event)">Missed it</button>';
        html += '<button class="btn hit" onclick="nextCard(event)">Got it</button>';
        html += '</div>';
        return html;
      }

      window.flipCard = function () {
        flipped = !flipped;
        render();
      };

      window.nextCard = function (e) {
        e.stopPropagation();
        flipped = false;
        qIdx++;
        render();
      };

      function renderQuiz() {
        var quiz = getQuiz();
        if (quiz.length === 0) return '<div class="panel">No quiz questions available for this unit.</div>';
        if (quizIdx >= quiz.length) {
          var html = '<div class="panel" style="text-align:center; padding:32px;">';
          html += '<h2>Quiz Complete!</h2>';
          html += '<p style="font-size:1.1rem; margin:12px 0;">Your Score: <b>' + quizScore + ' / ' + quiz.length + '</b></p>';
          html += '<button class="btn primary" style="max-width:200px; margin:0 auto;" onclick="resetQuiz()">Try Again</button>';
          html += '</div>';
          return html;
        }

        var q = quiz[quizIdx];
        var html = '<div class="panel">';
        html += '<div class="topic-tag"><span>' + q.topic + '</span><span>Question ' + (quizIdx + 1) + ' / ' + quiz.length + '</span></div>';
        html += '<div class="q-text">' + q.q + '</div>';
        html += '<div class="opts">';
        q.opts.forEach(function (opt, idx) {
          var cls = 'opt';
          if (quizSelected !== null) {
            if (idx === q.ans) cls += ' right';
            else if (idx === quizSelected) cls += ' wrong';
          }
          html += '<button class="' + cls + '" ' + (quizSelected !== null ? 'disabled' : '') + ' onclick="selectOpt(' + idx + ')">' + opt + '</button>';
        });
        html += '</div>';
        if (quizSelected !== null) {
          html += '<button class="btn primary" style="margin-top:12px;" onclick="nextQuiz()">Next Question</button>';
        }
        html += '</div>';
        return html;
      }

      window.selectOpt = function (idx) {
        quizSelected = idx;
        if (idx === getQuiz()[quizIdx].ans) quizScore++;
        render();
      };

      window.nextQuiz = function () {
        quizIdx++;
        quizSelected = null;
        render();
      };

      window.resetQuiz = function () {
        quizIdx = 0; quizSelected = null; quizScore = 0;
        render();
      };

      function render() {
        renderHeader();
        var main = document.getElementById('view');
        if (tab === 'notes') main.innerHTML = renderNotes();
        else if (tab === 'study') main.innerHTML = renderStudy();
        else if (tab === 'quiz') main.innerHTML = renderQuiz();
      }

      render();
    })();
  </script>
</body>
</html>
