<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Recall Deck - Computer Science</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <style>
    :root {
      --bg: #eceff1;
      --surface: #fbfcfc;
      --ink: #15212b;
      --muted: #5b6874;
      --line: #d0d7dc;
      --accent: #a8480c;
      --accent-ink: #ffffff;
      --good: #17744f;
      --bad: #b4262f;
      --track: #dde3e7;
      --display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
      --body: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
      --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #11181e; --surface: #19232b; --ink: #e8edf0; --muted: #94a2ad; --line: #2c3a45;
        --accent: #f0a24b; --accent-ink: #1a1204; --good: #4fc596; --bad: #f0707a; --track: #26333d;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #11181e; --surface: #19232b; --ink: #e8edf0; --muted: #94a2ad; --line: #2c3a45;
      --accent: #f0a24b; --accent-ink: #1a1204; --good: #4fc596; --bad: #f0707a; --track: #26333d;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5;
      padding-block: 20px 48px;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
    }
    .wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    h1 { font-family: var(--display); font-weight: 700; font-size: 1.75rem; letter-spacing: -0.02em; margin: 0; }
    .subject-picker { display: flex; gap: 8px; flex-wrap: wrap; }
    .subj-btn {
      font-family: var(--mono); font-size: 0.85rem; padding: 6px 14px; border-radius: 20px;
      border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer;
    }
    .subj-btn.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 500; }
    .filter-bar { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    select {
      font: 400 0.9rem var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line);
      border-radius: 6px; padding: 8px 12px; max-width: 340px; cursor: pointer; width: 100%;
    }
    nav { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
    nav button {
      background: none; border: 0; border-bottom: 3px solid transparent; color: var(--muted);
      font: 500 0.95rem var(--body); padding: 10px 14px 9px; cursor: pointer; white-space: nowrap;
    }
    nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
    button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .card {
      background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 28px 24px;
      min-height: 260px; display: flex; flex-direction: column; gap: 18px; cursor: pointer; user-select: none;
    }
    .topic { font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
    .q { font-family: var(--display); font-weight: 500; font-size: 1.4rem; line-height: 1.3; margin: 0; }
    .ans { border-top: 1px dashed var(--line); padding-top: 16px; font-size: 1.05rem; color: var(--ink); }
    .hint { margin-top: auto; font-size: 0.82rem; color: var(--muted); }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn {
      font: 600 1rem var(--body); padding: 12px 16px; border-radius: 6px; border: 1px solid var(--line);
      background: var(--surface); color: var(--ink); cursor: pointer; text-align: center;
    }
    .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .btn.miss { color: var(--bad); border-color: var(--bad); }
    .btn.hit { color: var(--good); border-color: var(--good); }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .panel h2 { font-family: var(--display); font-size: 1.2rem; margin: 0; }
    .unit-h { font-family: var(--display); font-size: 1.15rem; margin: 18px 0 8px; border-bottom: 1px solid var(--line); padding-bottom: 4px; color: var(--accent); }
    .note-item { margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px dashed var(--line); }
    .note-item b { font-family: var(--display); font-size: 1rem; display: block; margin-bottom: 4px; }
    .note-item ul { margin: 4px 0 0; padding-left: 1.2em; color: var(--muted); font-size: 0.95rem; }
    .opts { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .opt { display: flex; gap: 10px; text-align: left; width: 100%; font: 400 0.95rem var(--body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; cursor: pointer; }
    .opt:hover:not(:disabled) { border-color: var(--accent); }
    .opt.right { border-color: var(--good); background: rgba(23, 116, 79, 0.1); }
    .opt.wrong { border-color: var(--bad); background: rgba(180, 38, 47, 0.1); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Recall Deck</h1>
      <div class="subject-picker" id="subjects"></div>
    </header>
    <nav role="tablist" id="tabs"></nav>
    <main id="view"></main>
  </div>

  <script>
    (function () {
      var currentSubj = 'cs';
      var currentUnit = 'all';
      var tab = 'study';
      var flipped = false;
      var qIdx = 0;
      var quizIdx = 0;
      var quizSelected = null;
      var quizScore = 0;

      var DATA = {
        cs: {
          title: "OCR GCSE Computer Science (J277)",
          units: [
            {
              id: "cs1_1",
              name: "1.1 Systems Architecture",
              cards: [
                { q: "What is the purpose of the CPU?", a: "To process data and instructions by repeatedly fetching, decoding, and executing them." },
                { q: "What does the ALU (arithmetic logic unit) do?", a: "Carries out arithmetic operations (+, -) and logical comparisons (AND, OR, NOT, <, >)." },
                { q: "What does the control unit (CU) do?", a: "Manages the F-D-E cycle, decodes instructions, and sends control signals to coordinate components." },
                { q: "What is cache memory?", a: "Extremely fast memory built into or near the CPU that holds frequently used data/instructions." },
                { q: "What does the MAR (Memory Address Register) hold?", a: "The memory address of the location currently being read from or written to." },
                { q: "What does the MDR (Memory Data Register) hold?", a: "The actual data or instruction fetched from main memory, or waiting to be written to memory." },
                { q: "What does the Program Counter (PC) store?", a: "The memory address of the NEXT instruction to be fetched." },
                { q: "What does the Accumulator (ACC) store?", a: "The immediate intermediate results of calculations performed by the ALU." }
              ],
              notes: [
                { t: "Von Neumann Architecture", points: ["Data and instructions share the SAME memory space and bus system.", "F-D-E Cycle: PC copied to MAR -> Instruction fetched to MDR -> PC increments -> CU decodes -> ALU executes."] },
                { t: "CPU Performance Factors", points: ["Clock Speed (GHz): Higher means more cycles per second.", "Cache Size: Larger cache reduces slow accesses to RAM.", "Cores: More independent processors allow parallel execution (requires multicore software)."] }
              ],
              quiz: [
                { q: "Which register holds the address of the NEXT instruction?", opts: ["MAR", "MDR", "Program Counter", "Accumulator"], ans: 2 }
              ]
            },
            {
              id: "cs1_2",
              name: "1.2 Memory & Storage",
              cards: [
                { q: "What is RAM?", a: "Volatile primary storage that holds open programs and active data currently in use." },
                { q: "What is ROM?", a: "Non-volatile primary storage containing essential boot-up instructions (BIOS/firmware)." },
                { q: "What is Virtual Memory?", a: "A section of secondary storage used as extra RAM when physical RAM is fully allocated." },
                { q: "Compare SSD vs HDD.", a: "SSDs have no moving parts, are faster, more durable, and quieter, but cost more per GB than HDDs." }
              ],
              notes: [
                { t: "Primary vs Secondary Storage", points: ["Primary: Volatile (RAM), directly accessed by CPU, fast.", "Secondary: Non-volatile, holds OS/files permanently (Solid State, Magnetic, Optical)."] },
                { t: "Data Units & Calculations", points: ["Bit, Nibble (4 bits), Byte (8 bits), KB (1000 Bytes), MB, GB, TB.", "Sound File Size = Sample Rate x Bit Depth x Duration (s).", "Image File Size = Width x Height x Colour Depth (bits)."] }
              ],
              quiz: [
                { q: "Which characteristic best describes RAM?", opts: ["Non-volatile & read-only", "Volatile & read/write", "Non-volatile & optical", "Volatile & read-only"], ans: 1 }
              ]
            },
            {
              id: "cs1_3",
              name: "1.3 Networks, Connections & Protocols",
              cards: [
                { q: "What is a LAN?", a: "Local Area Network: Covers a small geographical site (e.g. school) with owned infrastructure." },
                { q: "What is a WAN?", a: "Wide Area Network: Covers a large geographical area, linking LANs using third-party telecoms infrastructure." },
                { q: "What does DNS do?", a: "Translates human-readable domain names (e.g. google.com) into numerical IP addresses." },
                { q: "What is the difference between MAC and IP addresses?", a: "MAC is a fixed hardware address burned into the NIC; IP is a logical address assigned for routing on a network." }
              ],
              notes: [
                { t: "Protocols & Layers", points: ["TCP/IP: Packet switching & routing.", "HTTP/HTTPS: Web page retrieval (HTTPS adds TLS/SSL encryption).", "FTP: File transfers.", "SMTP/POP3/IMAP: Email sending, downloading, and synchronisation."] }
              ],
              quiz: [
                { q: "Which protocol is used to encrypt secure web page communication?", opts: ["HTTP", "HTTPS", "FTP", "IMAP"], ans: 1 }
              ]
            },
            {
              id: "cs1_4",
              name: "1.4 Network Security",
              cards: [
                { q: "What is Phishing?", a: "Social engineering technique using deceptive communications to trick users into handing over sensitive data." },
                { q: "What is SQL Injection?", a: "Inserting malicious SQL code into web input fields to manipulate or extract underlying database data." },
                { q: "What is a Firewall?", a: "Hardware or software that inspects incoming/outgoing network packets against rules to block unauthorized traffic." }
              ],
              notes: [
                { t: "Threats & Mitigations", points: ["Malware: Viruses, Worms, Trojans, Ransomware, Spyware.", "Penetration Testing: Authorized simulated attacks to expose vulnerabilities.", "Input Sanitation & Validation: Prevents injection attacks."] }
              ],
              quiz: [
                { q: "What is used to prevent SQL Injection attacks?", opts: ["Firewall", "Input Validation", "Defragging", "MAC Filtering"], ans: 1 }
              ]
            },
            {
              id: "cs1_5",
              name: "1.5 Systems Software",
              cards: [
                { q: "What are the core functions of an Operating System?", a: "User interface, memory management, multitasking, peripheral management, file system management, and user security." },
                { q: "What is Defragmentation?", a: "Reorganizing fragmented file blocks on a magnetic hard drive so contiguous sectors are together, speeding up read access." }
              ],
              notes: [
                { t: "OS & Utility Software", points: ["Device Drivers: Provide software bridges between OS and peripheral hardware.", "Defragmentation is NOT suitable for SSDs (no read head delay, wears out cells)."] }
              ],
              quiz: [
                { q: "Why should defragmentation NOT be run on SSDs?", opts: ["It erases data", "It causes malware", "SSDs have no moving parts & it degrades lifespan", "It slows down CPU"], ans: 2 }
              ]
            }
          ]
        }
      };

      function renderHeader() {
        var subHtml = '<button class="subj-btn active">Computer Science</button>';
        document.getElementById('subjects').innerHTML = subHtml;

        var navHtml = '';
        var tabs = [
          { id: 'study', label: 'Flashcards' },
          { id: 'notes', label: 'Revision Notes' },
          { id: 'quiz', label: 'Practice Quiz' }
        ];
        tabs.forEach(function (t) {
          navHtml += '<button aria-selected="' + (tab === t.id) + '" onclick="setTab(\'' + t.id + '\')">' + t.label + '</button>';
        });
        document.getElementById('tabs').innerHTML = navHtml;
      }

      window.setUnit = function (u) {
        currentUnit = u;
        qIdx = 0;
        quizIdx = 0;
        quizSelected = null;
        quizScore = 0;
        flipped = false;
        render();
      };

      window.setTab = function (t) {
        tab = t;
        flipped = false;
        render();
      };

      function getFilteredUnits() {
        var units = DATA[currentSubj].units;
        if (currentUnit === 'all') return units;
        return units.filter(function (u) { return u.id === currentUnit; });
      }

      function getCards() {
        var list = [];
        getFilteredUnits().forEach(function (u) {
          u.cards.forEach(function (c) {
            list.push({ topic: u.name, q: c.q, a: c.a });
          });
        });
        return list;
      }

      function getQuiz() {
        var list = [];
        getFilteredUnits().forEach(function (u) {
          u.quiz.forEach(function (q) {
            list.push({ topic: u.name, q: q.q, opts: q.opts, ans: q.ans });
          });
        });
        return list;
      }

      function renderUnitSelector() {
        var html = '<div class="filter-bar">';
        html += '<label style="font-size:0.85rem; color:var(--muted); width:100%;">Filter by Topic / Unit:';
        html += '<select onchange="setUnit(this.value)">';
        html += '<option value="all" ' + (currentUnit === 'all' ? 'selected' : '') + '>All Topics</option>';
        DATA[currentSubj].units.forEach(function (u) {
          html += '<option value="' + u.id + '" ' + (currentUnit === u.id ? 'selected' : '') + '>' + u.name + '</option>';
        });
        html += '</select></label></div>';
        return html;
      }

      function renderStudy() {
        var cards = getCards();
        var html = renderUnitSelector();
        if (cards.length === 0) return html + '<div class="panel">No cards available for this unit.</div>';
        var c = cards[qIdx % cards.length];
        html += '<div class="card" onclick="flipCard()">';
        html += '<div class="topic"><span>' + c.topic + '</span><span>' + (qIdx + 1) + '/' + cards.length + '</span></div>';
        html += '<div class="q">' + c.q + '</div>';
        if (flipped) {
          html += '<div class="ans">' + c.a + '</div>';
        } else {
          html += '<div class="hint">Click to reveal answer</div>';
        }
        html += '</div>';
        html += '<div class="actions">';
        html += '<button class="btn miss" onclick="nextCard(event)">Missed it</button>';
        html += '<button class="btn hit" onclick="nextCard(event)">Got it</button>';
        html += '</div>';
        return html;
      }

      window.flipCard = function () {
        flipped = !flipped;
        render();
      };

      window.nextCard = function (e) {
        e.stopPropagation();
        flipped = false;
        qIdx++;
        render();
      };

      function renderNotes() {
        var html = renderUnitSelector();
        html += '<div class="panel">';
        html += '<h2>' + DATA[currentSubj].title + '</h2>';
        getFilteredUnits().forEach(function (u) {
          html += '<div class="unit-h">' + u.name + '</div>';
          u.notes.forEach(function (n) {
            html += '<div class="note-item"><b>' + n.t + '</b><ul>';
            n.points.forEach(function (p) {
              html += '<li>' + p + '</li>';
            });
            html += '</ul></div>';
          });
        });
        html += '</div>';
        return html;
      }

      function renderQuiz() {
        var quiz = getQuiz();
        var html = renderUnitSelector();
        if (quiz.length === 0) return html + '<div class="panel">No quiz questions available for this unit.</div>';

        if (quizIdx >= quiz.length) {
          html += '<div class="panel" style="text-align:center; padding:30px;">';
          html += '<h2>Quiz Complete!</h2>';
          html += '<p>Score: <b>' + quizScore + ' / ' + quiz.length + '</b></p>';
          html += '<button class="btn primary" onclick="resetQuiz()">Try Again</button>';
          html += '</div>';
          return html;
        }

        var q = quiz[quizIdx];
        html += '<div class="panel">';
        html += '<div class="topic"><span>' + q.topic + '</span><span>Question ' + (quizIdx + 1) + '/' + quiz.length + '</span></div>';
        html += '<div class="q">' + q.q + '</div>';
        html += '<div class="opts">';
        q.opts.forEach(function (opt, idx) {
          var cls = 'opt';
          if (quizSelected !== null) {
            if (idx === q.ans) cls += ' right';
            else if (idx === quizSelected) cls += ' wrong';
          }
          html += '<button class="' + cls + '" ' + (quizSelected !== null ? 'disabled' : '') + ' onclick="selectOpt(' + idx + ')">' + opt + '</button>';
        });
        html += '</div>';

        if (quizSelected !== null) {
          html += '<button class="btn primary" style="margin-top:10px;" onclick="nextQuiz()">Next Question</button>';
        }
        html += '</div>';
        return html;
      }

      window.selectOpt = function (idx) {
        quizSelected = idx;
        if (idx === getQuiz()[quizIdx].ans) quizScore++;
        render();
      };

      window.nextQuiz = function () {
        quizIdx++;
        quizSelected = null;
        render();
      };

      window.resetQuiz = function () {
        quizIdx = 0;
        quizSelected = null;
        quizScore = 0;
        render();
      };

      function render() {
        renderHeader();
        var main = document.getElementById('view');
        if (tab === 'study') main.innerHTML = renderStudy();
        else if (tab === 'notes') main.innerHTML = renderNotes();
        else if (tab === 'quiz') main.innerHTML = renderQuiz();
      }

      render();
    })();
  </script>
</body>
</html>
