<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Recall Deck - OCR GCSE Computer Science</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <style>
    :root {
      --bg: #0d1318;
      --surface: #141c24;
      --surface-card: #19232c;
      --ink: #e8edf0;
      --muted: #8a9ba8;
      --line: #24323e;
      --accent: #00c896;
      --accent-ink: #0d1318;
      --good: #4fc596;
      --bad: #f0707a;
      --track: #26333d;
      --display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
      --body: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
      --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
    }
    :root[data-theme="light"] {
      --bg: #eceff1;
      --surface: #fbfcfc;
      --surface-card: #ffffff;
      --ink: #15212b;
      --muted: #5b6874;
      --line: #d0d7dc;
      --accent: #a8480c;
      --accent-ink: #ffffff;
      --good: #17744f;
      --bad: #b4262f;
      --track: #dde3e7;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5;
      padding: 24px 16px 48px;
    }
    .wrap { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
    
    .top-box {
      background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    }
    .brand h1 { font-family: var(--display); font-weight: 700; font-size: 1.8rem; letter-spacing: -0.02em; margin: 0; }
    .brand .sub { font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.05em; color: var(--muted); text-transform: uppercase; margin-top: 4px; display: block; }
    
    .header-controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    
    .pill-picker { display: flex; background: var(--bg); border: 1px solid var(--line); border-radius: 30px; padding: 4px; gap: 4px; }
    .pill-btn {
      font-family: var(--body); font-size: 0.85rem; padding: 6px 14px; border-radius: 20px;
      border: 0; background: transparent; color: var(--muted); cursor: pointer; transition: all 0.2s;
    }
    .pill-btn.active { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

    .mode-btn {
      font-family: var(--body); font-size: 0.85rem; padding: 8px 14px; border-radius: 20px;
      border: 1px solid var(--line); background: var(--bg); color: var(--muted); cursor: pointer;
    }
    .mode-btn:hover { border-color: var(--accent); color: var(--ink); }

    .nav-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--line); padding-bottom: 2px; flex-wrap: wrap;
    }
    .tabs { display: flex; gap: 4px; overflow-x: auto; }
    .tabs button {
      background: none; border: 0; border-bottom: 3px solid transparent; color: var(--muted);
      font: 500 0.95rem var(--body); padding: 10px 14px 9px; cursor: pointer; white-space: nowrap;
    }
    .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

    .unit-select-wrap { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 0.75rem; color: var(--muted); text-transform: uppercase; }
    select {
      font: 400 0.85rem var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line);
      border-radius: 6px; padding: 6px 10px; cursor: pointer; max-width: 280px;
    }

    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 18px; }
    .unit-title-header { font-family: var(--display); font-size: 1.4rem; color: var(--accent); margin: 0 0 8px; display: flex; justify-content: space-between; align-items: baseline; }
    .unit-sub-tag { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); font-weight: 400; text-transform: uppercase; }

    .cognito-card {
      background: var(--surface-card); border: 1px solid var(--line); border-left: 4px solid var(--accent);
      border-radius: 8px; padding: 20px; display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px;
    }
    .cognito-card h3 { font-family: var(--display); font-size: 1.1rem; margin: 0; color: var(--ink); }
    .cognito-card p { margin: 0; font-size: 0.95rem; color: var(--ink); line-height: 1.6; }
    .cognito-card ul { margin: 4px 0 0; padding-left: 1.2em; color: var(--muted); font-size: 0.92rem; display: flex; flex-direction: column; gap: 6px; }

    .flashcard {
      background: var(--surface-card); border: 1px solid var(--line); border-radius: 8px; padding: 32px 24px;
      min-height: 280px; display: flex; flex-direction: column; gap: 18px; cursor: pointer; user-select: none;
    }
    .topic-tag { font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
    .q-text { font-family: var(--display); font-weight: 500; font-size: 1.35rem; line-height: 1.3; margin: 0; }
    .ans-text { border-top: 1px dashed var(--line); padding-top: 16px; font-size: 1.05rem; color: var(--ink); }
    .card-hint { margin-top: auto; font-size: 0.82rem; color: var(--muted); }
    
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn {
      font: 600 1rem var(--body); padding: 12px 16px; border-radius: 6px; border: 1px solid var(--line);
      background: var(--surface-card); color: var(--ink); cursor: pointer; text-align: center;
    }
    .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .btn.miss { color: var(--bad); border-color: var(--bad); }
    .btn.hit { color: var(--good); border-color: var(--good); }

    .opts { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .opt { display: flex; gap: 10px; text-align: left; width: 100%; font: 400 0.95rem var(--body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 12px; cursor: pointer; }
    .opt:hover:not(:disabled) { border-color: var(--accent); }
    .opt.right { border-color: var(--good); background: rgba(79, 197, 150, 0.1); }
    .opt.wrong { border-color: var(--bad); background: rgba(240, 112, 122, 0.1); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top-box">
      <div class="brand">
        <h1>Recall Deck</h1>
        <span class="sub">OCR GCSE Computer Science (J277)</span>
      </div>
      <div class="header-controls">
        <div class="pill-picker" id="subjects"></div>
        <button class="mode-btn" onclick="toggleTheme()" id="themeBtn">Light Mode</button>
      </div>
    </div>

    <div class="nav-bar">
      <nav class="tabs" id="tabs"></nav>
      <div class="unit-select-wrap">
        <span>Unit:</span>
        <select id="unitSelect" onchange="setUnit(this.value)"></select>
      </div>
    </div>

    <main id="view"></main>
  </div>

  <script>
    (function () {
      var currentSubj = 'comp1';
      var currentUnit = 'all';
      var tab = 'notes';
      var flipped = false;
      var qIdx = 0;
      var quizIdx = 0;
      var quizSelected = null;
      var quizScore = 0;
      var theme = 'dark';

      var DATA = {
        comp1: {
          title: "Component 1: Computer Systems",
          units: [
            {
              id: "c1_1",
              name: "1.1 Systems Architecture",
              notes: [
                { t: "The Central Processing Unit (CPU) Architecture", content: "The CPU fetches, decodes, and executes instructions to process data.", points: ["Arithmetic Logic Unit (ALU): Executes arithmetic operations (+, -, *, /) and logical comparisons (AND, OR, NOT, <, >, =).", "Control Unit (CU): Coordinates the F-D-E cycle, decodes machine instructions, and sends control signals along buses.", "Cache Memory: Small, extremely fast static RAM located on or very close to the CPU chip, storing frequently used data/instructions to minimize slow RAM access delays.", "Registers: Tiny, lightning-fast storage locations inside the CPU holding data currently being processed."] },
                { t: "Von Neumann Architecture & Registers", content: "Von Neumann architecture stores both program instructions and data together in the same primary memory storage.", points: ["Memory Address Register (MAR): Holds the memory address of the instruction or data currently needed to be read from or written to.", "Memory Data Register (MDR): Holds the actual data or instruction fetched from memory, or waiting to be written.", "Program Counter (PC): Holds the exact memory address of the very next instruction to be fetched.", "Accumulator (ACC): Temporarily stores the intermediate results of ALU calculations."] },
                { t: "CPU Performance Factors", content: "Three core hardware factors dictate overall microprocessor performance and throughput.", points: ["Clock Speed: Measured in Gigahertz (GHz), representing billions of processing cycles per second. Higher clock speed means faster instruction execution.", "Cache Size: Larger cache capacity holds more active instructions locally, reducing latency caused by fetching from main memory.", "Number of Cores: Multi-core processors allow independent tasks or parallelized threads to run simultaneously, multiplying processing capability if software supports it."] }
              ],
              cards: [
                { q: "What is the function of the Program Counter (PC)?", a: "It stores the memory address of the next instruction to be fetched during the F-D-E cycle." },
                { q: "What does von Neumann architecture store in main memory?", a: "Both program instructions and data share the same unified main memory space." }
              ],
              quiz: [
                { q: "According to the notes, which component coordinates the F-D-E cycle and sends control signals?", opts: ["ALU", "Control Unit (CU)", "MAR", "Accumulator"], ans: 1 },
                { q: "What is stored in the Accumulator (ACC)?", opts: ["The address of the next instruction", "Intermediate results of calculations from the ALU", "Data waiting to be written to ROM", "The clock speed frequency"], ans: 1 },
                { q: "What defines Von Neumann Architecture?", opts: ["Data and instructions are stored separately in two different physical chips", "Program instructions and data share the same main memory", "The CPU has no registers", "Data can only be processed using optical lasers"], ans: 1 },
                { q: "Which register holds the memory address of the data about to be read or written?", opts: ["MDR", "Program Counter", "MAR", "Accumulator"], ans: 2 }
              ]
            },
            {
              id: "c1_2",
              name: "1.2 Memory and Storage",
              notes: [
                { t: "Primary Storage (RAM & ROM)", content: "Primary storage is directly accessible by the CPU, essential for running active applications.", points: ["RAM (Random Access Memory): Volatile primary storage holding open applications, files, and parts of the OS currently in use. Data is lost when power is cut.", "ROM (Read-Only Memory): Non-volatile memory containing immutable boot-up code (BIOS/firmware) needed to initialize hardware upon startup.", "Virtual Memory: A designated portion of secondary storage utilized as overflow RAM when physical RAM is fully saturated. Slower due to disk read/write latency."] },
                { t: "Secondary Storage & Data Units", content: "Secondary storage provides non-volatile, permanent retention of programs and files.", points: ["Storage Media Types: Magnetic (HDDs using magnetic platters), Optical (CD/DVD/Blu-ray using lasers), and Solid State (SSDs using flash memory chips; fast, durable, silent).", "Data Storage Units: Bit (0 or 1), Nibble (4 bits), Byte (8 bits), Kilobyte (1,000 bytes), Megabyte, Gigabyte, Terabyte, Petabyte.", "File Calculations: Image size = Width × Height × Colour depth (bits). Sound size = Sample rate × Bit depth × Duration (seconds)."] }
              ],
              cards: [
                { q: "What is the difference between volatile and non-volatile memory?", a: "Volatile memory loses its contents when power is turned off (e.g. RAM); non-volatile memory retains data permanently (e.g. ROM, SSDs)." }
              ],
              quiz: [
                { q: "What characterises RAM according to the notes?", opts: ["Non-volatile and read-only", "Volatile primary storage holding active programs/files in use", "Secondary storage using magnetic platters", "Immutable boot-up firmware"], ans: 1 },
                { q: "When is Virtual Memory utilized?", opts: ["When the CPU clock speed drops", "As overflow RAM in secondary storage when physical RAM is full", "To boot up the BIOS", "When calculating sound file sizes"], ans: 1 },
                { q: "Which secondary storage type uses flash memory chips with no moving parts?", opts: ["Magnetic", "Optical", "Solid State (SSD)", "Tape"], ans: 2 },
                { q: "According to the notes, what formula calculates sound file size?", opts: ["Width × Height × Colour depth", "Sample rate × Bit depth × Duration (seconds)", "Sample rate × Width × 8", "Duration × Bit rate / 1000"], ans: 1 }
              ]
            },
            {
              id: "c1_3",
              name: "1.3 Networks, Connections & Protocols",
              notes: [
                { t: "Network Topologies & Hardware", content: "Networks connect computers to share hardware peripherals, data, and communication channels.", points: ["LAN vs WAN: Local Area Networks cover small geographical sites under single ownership; Wide Area Networks connect distant LANs using leased telecommunication lines (e.g., The Internet).", "Star Topology: Every device connects independently to a central switch or server. Robust against individual cable failure, but the central switch is a single point of failure.", "Hardware Components: Router (directs packets between distinct networks), Switch (directs frames within a LAN), WAP (wireless access point), NIC (Network Interface Card providing physical/wireless connection)."] },
                { t: "IP/MAC Addressing & Protocols", content: "Data transmission relies on strict standardized rules (protocols) and unique addressing schemes.", points: ["IP Address: Logical, hierarchical address assigned dynamically to devices on a network (IPv4 or IPv6) for routing packets across WANs.", "MAC Address: Unique physical hardware identifier burned into the NIC during manufacturing, operating at the data link layer.", "TCP/IP Protocol Suite: TCP splits data into numbered packets and handles error checking/reassembly; IP routes packets across networks.", "Web & Email Protocols: HTTP/HTTPS (web browsing, HTTPS uses TLS/SSL encryption), FTP (file transfers), SMTP (sending email), IMAP/POP3 (retrieving email)."] }
              ],
              cards: [
                { q: "What is the key difference between an IP address and a MAC address?", a: "An IP address is logical and changes depending on network location; a MAC address is a permanent physical hardware identifier burned into the NIC." }
              ],
              quiz: [
                { q: "What is the function of a Router as stated in the notes?", opts: ["Directs frames within a single LAN", "Directs packets between distinct networks", "Connects wireless devices to a wired cable", "Burns MAC addresses onto NICs"], ans: 1 },
                { q: "In a Star Topology, what is a single point of failure?", opts: ["Any client cable", "The central switch or server", "The wireless access point", "The MAC address"], ans: 1 },
                { q: "What role does TCP play in the TCP/IP protocol suite?", opts: ["Routes packets across WANs", "Splits data into numbered packets and handles error checking/reassembly", "Encrypts web pages using SSL", "Translates domain names to IP addresses"], ans: 1 },
                { q: "Which protocol sends email according to the notes?", opts: ["IMAP", "POP3", "SMTP", "FTP"], ans: 2 }
              ]
            },
            {
              id: "c1_4",
              name: "1.4 Network Security",
              notes: [
                { t: "Cybersecurity Threats & Vulnerabilities", content: "Networks and standalone systems face diverse digital attacks and social engineering risks.", points: ["Malware: Malicious software including viruses (attaching to host files), worms (self-replicating across networks), trojans (disguised as legitimate software), ransomware (encrypting user files for extortion), and spyware.", "Social Engineering: Psychological manipulation of humans into divulging confidential information (e.g., Phishing via deceptive emails).", "Brute-Force Attacks: Automated software scripts testing every possible password combination until successful.", "SQL Injection: Inserting malicious SQL syntax into web input boxes to bypass authentication or extract database contents."] },
                { t: "Defensive Measures & Prevention", content: "Robust security frameworks protect enterprise infrastructure from compromise.", points: ["Penetration Testing: Authorized simulated attacks conducted by ethical hackers to identify system vulnerabilities before malicious actors do.", "Firewalls: Hardware or software inspecting incoming and outgoing packet headers against preset security rules.", "User Access Levels: Restricting file permissions so users can only access data necessary for their specific job role.", "Encryption: Scrambling plain text into ciphertext using cryptographic keys, rendering intercepted data unreadable without the decryption key."] }
              ],
              cards: [
                { q: "What is phishing?", a: "A social engineering technique where attackers trick individuals into revealing sensitive data via deceptive emails or websites." }
              ],
              quiz: [
                { q: "Which type of malware encrypts user files for extortion according to the notes?", opts: ["Spyware", "Trojans", "Ransomware", "Worms"], ans: 2 },
                { q: "What is defined as Penetration Testing in the notes?", opts: ["Checking passwords with brute-force scripts", "Authorized simulated attacks by ethical hackers to identify vulnerabilities", "Filtering packet headers using firewall rules", "Encrypting plain text into ciphertext"], ans: 1 },
                { q: "How does the notes define SQL Injection?", opts: ["Sending fake emails to trick users", "Testing every password combination automatically", "Inserting malicious SQL syntax into web input boxes to bypass authentication", "Self-replicating across network cables"], ans: 2 },
                { q: "What does Encryption transform plain text into?", opts: ["HTML code", "Ciphertext", "SQL syntax", "Binary shift"], ans: 1 }
              ]
            },
            {
              id: "c1_5",
              name: "1.5 Systems Software",
              notes: [
                { t: "Operating Systems & Utility Software", content: "Systems software provides a stable platform for application execution and hardware management.", points: ["Operating System (OS) Core Functions: User interface (CLI/GUI), memory management, multitasking (CPU scheduling), peripheral device management, file management, and user security/access control.", "Device Drivers: Specialized software acting as a translator between the operating system and specific peripheral hardware devices.", "Utility Software: Maintenance tools including disk defragmentation (reorganizing fragmented magnetic sectors for faster read speeds), automated backups, compression utilities, and anti-malware scanners."] }
              ],
              cards: [
                { q: "What is the primary role of a device driver?", a: "To act as a translator enabling the operating system to communicate effectively with hardware peripherals." }
              ],
              quiz: [
                { q: "According to the notes, what is the role of a Device Driver?", opts: ["To schedule CPU multitasking", "To act as a translator between the OS and peripheral hardware", "To defragment magnetic sectors", "To encrypt user files"], ans: 1 },
                { q: "What does disk defragmentation do?", opts: ["Compresses large files for email transfer", "Reorganizes fragmented magnetic sectors for faster read speeds", "Backs up files to cloud servers", "Translates high-level code"], ans: 1 },
                { q: "Which of the following is listed as a core OS function in the notes?", opts: ["Input validation", "Defragmentation", "Peripheral device management", "Penetration testing"], ans: 2 }
              ]
            },
            {
              id: "c1_6",
              name: "1.6 Ethical, Legal, Cultural & Environmental Impacts",
              notes: [
                { t: "UK Legislation & Computer Law", content: "Key UK Acts of Parliament govern data privacy, computer misuse, and intellectual property.", points: ["Data Protection Act 2018 (GDPR): Requires personal data to be processed lawfully, fairly, transparently, held securely, kept accurate, and stored no longer than necessary. Grants individuals rights to access and delete their data.", "Computer Misuse Act 1990: Defines 3 criminal offences: 1. Unauthorised access to computer material (hacking). 2. Unauthorised access with intent to commit further offences. 3. Unauthorised modification of computer material (e.g. creating viruses or altering files).", "Copyright Designs and Patents Act 1988: Protects intellectual property rights of creators, making it illegal to copy, modify, or distribute software, music, or media without a license."] },
                { t: "Ethical, Cultural, Environmental & Licensing Issues", content: "Digital technology profoundly impacts society, privacy, energy, and software distribution.", points: ["Environmental Impacts: E-waste contains toxic heavy metals (lead, mercury) leaking into soil/water. Mining rare earth metals damages ecosystems. High electricity consumption in cloud data centers contributes to carbon emissions.", "Cultural & Privacy Issues: The Digital Divide creates social inequality between those with and without internet access. Concerns over mass surveillance, continuous tracking, and digital footprint loss.", "Open Source vs Proprietary Software: Open Source grants access to source code freely to inspect/modify. Proprietary software keeps source code secret and requires paid licenses."] }
              ],
              cards: [
                { q: "What are the 3 main offences defined by the Computer Misuse Act 1990?", a: "1. Unauthorised access to computer material. 2. Unauthorised access with intent to commit a crime. 3. Unauthorised modification of computer material." },
                { q: "What is the key difference between Open Source and Proprietary software?", a: "Open Source makes the underlying source code freely available to view and edit; Proprietary keeps code secret and protected under license." }
              ],
              quiz: [
                { q: "According to the notes, which Act requires personal data to be held securely and kept accurate?", opts: ["Computer Misuse Act 1990", "Data Protection Act 2018 (GDPR)", "Copyright Designs and Patents Act 1988", "Freedom of Information Act"], ans: 1 },
                { q: "What is offence #3 under the Computer Misuse Act 1990 as written in the notes?", opts: ["Unauthorised modification of computer material", "Unauthorised copying of music files", "Failing to recycle e-waste", "Stealing secondary storage drives"], ans: 0 },
                { q: "What distinguishes Open Source software in the notes?", opts: ["It requires paid annual subscription licenses", "Its source code is kept strictly secret", "Source code is granted freely to inspect and modify", "It cannot run on Linux"], ans: 2 },
                { q: "What environmental concern regarding e-waste is highlighted in the notes?", opts: ["Excessive plastic recycling", "Toxic heavy metals (lead, mercury) leaking into soil/water", "Radioactive radiation", "Depletion of paper supplies"], ans: 1 },
                { q: "What social issue is defined as 'The Digital Divide' in the notes?", opts: ["Dividing memory into primary and secondary storage", "Social inequality between those with and without internet access", "Separating networks into LANs and WANs", "Splitting software into open source and proprietary"], ans: 1 }
              ]
            }
          ]
        },
        comp2: {
          title: "Component 2: Computational Thinking, Algorithms & Programming",
          units: [
            {
              id: "c2_1",
              name: "2.1 Algorithms",
              notes: [
                { t: "Computational Thinking & Searching Algorithms", content: "Algorithms are step-by-step logical instructions designed to solve specific problems.", points: ["Computational Thinking Pillars: Abstraction (removing unnecessary detail), Decomposition (breaking complex problems into smaller sub-problems), Algorithmic Thinking (producing ordered steps).", "Binary Search: Requires a sorted list. Examines the middle item; if target is higher/lower, discards half the list repeatedly. Time complexity: O(log n).", "Linear Search: Iterates through a list sequentially from start to finish checking each item. Works on unsorted lists. Time complexity: O(n)."] },
                { t: "Sorting Algorithms", content: "Sorting arranges datasets into numerical or alphabetical order.", points: ["Bubble Sort: Compares adjacent pairs of items, swapping them if out of order, repeating until no swaps occur. Inefficient for large datasets.", "Merge Sort: Uses divide-and-conquer recursion; splits the list down to single elements, then merges sorted sub-lists back together efficiently (O(n log n))."] }
              ],
              cards: [
                { q: "What condition is strictly required for a binary search to work?", a: "The input dataset must already be sorted in order." }
              ],
              quiz: [
                { q: "How is Abstraction defined in the notes?", opts: ["Breaking a complex problem into smaller sub-problems", "Removing unnecessary detail to focus on essential features", "Producing ordered steps for a computer", "Comparing adjacent pairs of items"], ans: 1 },
                { q: "Which search algorithm requires a sorted list to function?", opts: ["Linear search", "Binary search", "Bubble search", "Decomposition"], ans: 1 },
                { q: "What strategy does Merge Sort use according to the notes?", opts: ["Iterating linearly from index 0", "Comparing adjacent pairs continuously", "Divide-and-conquer recursion", "Removing unnecessary details"], ans: 2 }
              ]
            },
            {
              id: "c2_2",
              name: "2.2 Programming Fundamentals",
              notes: [
                { t: "Data Types, Constructs & Operations", content: "Programming languages rely on foundational constructs and data representation.", points: ["Common Data Types: Integer (whole numbers), Real/Float (decimals), Boolean (True/False), Character (single alphanumeric), String (text sequence).", "Three Basic Programming Constructs: Sequence (executing code line by line), Selection (conditional branching using IF/ELSE or SWITCH), Iteration (looping via FOR or WHILE loops).", "String Manipulation & Arrays: Extracting substrings, converting case, and indexing 1D/2D arrays to store structured collections of data."] }
              ],
              cards: [
                { q: "What is the difference between integer and float data types?", a: "Integer represents whole numbers without fractions, whereas float (real) numbers contain fractional decimal components." }
              ],
              quiz: [
                { q: "Which programming construct is defined as 'conditional branching using IF/ELSE'?", opts: ["Sequence", "Selection", "Iteration", "Array"], ans: 1 },
                { q: "What data type represents single alphanumeric symbols according to the notes?", opts: ["String", "Integer", "Character", "Real/Float"], ans: 2 },
                { q: "Which construct represents executing code line by line?", opts: ["Sequence", "Selection", "Iteration", "Recursion"], ans: 0 }
              ]
            },
            {
              id: "c2_3",
              name: "2.3 Producing Robust Programs",
              notes: [
                { t: "Defensive Design & Testing", content: "Robust programs anticipate user errors, invalid inputs, and security vulnerabilities.", points: ["Defensive Design Principles: Input validation (checking data format, range, presence, length), authentication checks, maintainability (indentation, meaningful variable names, commenting).", "Syntax vs Logic Errors: Syntax errors violate programming language grammar rules preventing code compilation; logic errors allow code execution but produce incorrect outputs due to flawed algorithm design.", "Test Plans & Data: Using normal, boundary (extreme), and erroneous (invalid) test data to verify software reliability."] }
              ],
              cards: [
                { q: "What is boundary test data?", a: "Data pushed right on the very limits of acceptable valid ranges (e.g., testing age 0 or 120)." }
              ],
              quiz: [
                { q: "How are Syntax Errors defined in the notes?", opts: ["Errors that allow code execution but produce flawed outputs", "Violations of language grammar rules that prevent code compilation", "Data pushed right on valid limits", "Checks ensuring fields are not blank"], ans: 1 },
                { q: "Which input validation check is listed in the notes?", opts: ["Defragmentation check", "Presence, format, range, and length check", "Syntax error check", "Compiler check"], ans: 1 },
                { q: "What is Boundary Test Data as defined in the notes?", opts: ["Data of incorrect type that should be rejected", "Data pushed right on the limits of acceptable valid ranges", "Standard everyday inputs", "Unindented code comments"], ans: 1 }
              ]
            },
            {
              id: "c2_4",
              name: "2.4 Boolean Logic",
              notes: [
                { t: "Logic Gates & Truth Tables", content: "Boolean algebra evaluates logical propositions as True (1) or False (0).", points: ["NOT Gate: Inverts input (A=0 becomes Q=1).", "AND Gate: Outputs True only if BOTH inputs are True.", "OR Gate: Outputs True if AT LEAST ONE input is True.", "Logic Expressions & Circuits: Combining logic gates to construct combinational logic circuits for hardware processing."] }
              ],
              cards: [
                { q: "When does an AND gate output a True (1) signal?", a: "Only when both input A and input B are simultaneously True (1)." }
              ],
              quiz: [
                { q: "When does an AND Gate output True according to the notes?", opts: ["When at least one input is True", "Only if BOTH inputs are True", "When the input is 0", "When inputs are different"], ans: 1 },
                { q: "When does an OR Gate output True according to the notes?", opts: ["Only if both inputs are True", "If AT LEAST ONE input is True", "When the input is inverted", "Never"], ans: 1 }
              ]
            },
            {
              id: "c2_5",
              name: "2.5 Programming Languages & IDEs",
              notes: [
                { t: "Translators & IDE Facilities", content: "High-level programming code must be translated into machine code (binary) for CPU execution.", points: ["Compilers vs Interpreters: Compilers translate entire source code into machine code all at once, generating an executable file. Interpreters translate and execute source code line by line during runtime.", "IDEd Features: Integrated Development Environments provide error diagnostics, syntax highlighting, auto-indentation, debugging tools, and run-time environments."] }
              ],
              cards: [
                { q: "What is the main difference between a compiler and an interpreter?", a: "A compiler translates the whole program at once before execution; an interpreter translates and executes code line by line." }
              ],
              quiz: [
                { q: "According to the notes, how does an Interpreter operate?", opts: ["Translates entire source code all at once generating an executable file", "Translates and executes source code line by line during runtime", "Defragments secondary storage drives", "Protects personal data under GDPR"], ans: 1 },
                { q: "Which IDE facility is explicitly listed in the notes?", opts: ["Input validation", "Syntax highlighting and error diagnostics", "Packet filtering", "Defragmentation"], ans: 1 }
              ]
            }
          ]
        }
      };

      function renderHeader() {
        var subHtml = '';
        var keys = ['comp1', 'comp2'];
        var labels = { comp1: 'Component 1 (Systems)', comp2: 'Component 2 (Programming)' };
        keys.forEach(function (k) {
          subHtml += '<button class="pill-btn ' + (currentSubj === k ? 'active' : '') + '" onclick="setSubj(\'' + k + '\')">' + labels[k] + '</button>';
        });
        document.getElementById('subjects').innerHTML = subHtml;

        var navHtml = '';
        var tabs = [
          { id: 'notes', label: 'Detailed Notes' },
          { id: 'study', label: 'Flashcards' },
          { id: 'quiz', label: 'Practice Quiz' }
        ];
        tabs.forEach(function (t) {
          navHtml += '<button aria-selected="' + (tab === t.id) + '" onclick="setTab(\'' + t.id + '\')">' + t.label + '</button>';
        });
        document.getElementById('tabs').innerHTML = navHtml;

        var unitOpts = '<option value="all">All Units (' + DATA[currentSubj].title + ')</option>';
        DATA[currentSubj].units.forEach(function (u) {
          unitOpts += '<option value="' + u.id + '" ' + (currentUnit === u.id ? 'selected' : '') + '>' + u.name + '</option>';
        });
        document.getElementById('unitSelect').innerHTML = unitOpts;
        document.getElementById('themeBtn').textContent = theme === 'dark' ? 'Light Mode' : 'Dark Mode';
      }

      window.toggleTheme = function() {
        theme = theme === 'dark' ? 'light' : 'dark';
        if (theme === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        } else {
          document.documentElement.removeAttribute('data-theme');
        }
        renderHeader();
      };

      window.setSubj = function (s) {
        currentSubj = s;
        currentUnit = 'all';
        qIdx = 0; quizIdx = 0; quizSelected = null; quizScore = 0; flipped = false;
        render();
      };

      window.setUnit = function (u) {
        currentUnit = u;
        qIdx = 0; quizIdx = 0; quizSelected = null; quizScore = 0; flipped = false;
        render();
      };

      window.setTab = function (t) {
        tab = t;
        flipped = false;
        render();
      };

      function getFilteredUnits() {
        var units = DATA[currentSubj].units;
        if (currentUnit === 'all') return units;
        return units.filter(function (u) { return u.id === currentUnit; });
      }

      function getCards() {
        var list = [];
        getFilteredUnits().forEach(function (u) {
          u.cards.forEach(function (c) {
            list.push({ topic: u.name, q: c.q, a: c.a });
          });
        });
        return list;
      }

      function getQuiz() {
        var list = [];
        getFilteredUnits().forEach(function (u) {
          u.quiz.forEach(function (q) {
            list.push({ topic: u.name, q: q.q, opts: q.opts, ans: q.ans });
          });
        });
        return list;
      }

      function renderNotes() {
        var html = '<div class="panel">';
        html += '<h2 style="font-family:var(--display); font-size:1.3rem; margin:0;">' + DATA[currentSubj].title + ' — Comprehensive Revision Guide</h2>';
        getFilteredUnits().forEach(function (u) {
          html += '<div style="margin-top:20px;">';
          html += '<div class="unit-title-header"><span>' + u.name + '</span><span class="unit-sub-tag">OCR GCSE J277</span></div>';
          u.notes.forEach(function (n) {
            html += '<div class="cognito-card">';
            html += '<h3>' + n.t + '</h3>';
            html += '<p>' + n.content + '</p>';
            if (n.points && n.points.length) {
              html += '<ul>';
              n.points.forEach(function (pt) {
                html += '<li>' + pt + '</li>';
              });
              html += '</ul>';
            }
            html += '</div>';
          });
          html += '</div>';
        });
        html += '</div>';
        return html;
      }

      function renderStudy() {
        var cards = getCards();
        if (cards.length === 0) return '<div class="panel">No flashcards available for this unit.</div>';
        var c = cards[qIdx % cards.length];
        var html = '<div class="flashcard" onclick="flipCard()">';
        html += '<div class="topic-tag"><span>' + c.topic + '</span><span>Card ' + (qIdx + 1) + ' / ' + cards.length + '</span></div>';
        html += '<div class="q-text">' + c.q + '</div>';
        if (flipped) {
          html += '<div class="ans-text">' + c.a + '</div>';
        } else {
          html += '<div class="card-hint">Click card to reveal detailed answer</div>';
        }
        html += '</div>';
        html += '<div class="actions">';
        html += '<button class="btn miss" onclick="nextCard(event)">Missed it</button>';
        html += '<button class="btn hit" onclick="nextCard(event)">Got it</button>';
        html += '</div>';
        return html;
      }

      window.flipCard = function () {
        flipped = !flipped;
        render();
      };

      window.nextCard = function (e) {
        e.stopPropagation();
        flipped = false;
        qIdx++;
        render();
      };

      function renderQuiz() {
        var quiz = getQuiz();
        if (quiz.length === 0) return '<div class="panel">No quiz questions available for this unit.</div>';
        if (quizIdx >= quiz.length) {
          var html = '<div class="panel" style="text-align:center; padding:32px;">';
          html += '<h2>Quiz Complete!</h2>';
          html += '<p style="font-size:1.1rem; margin:12px 0;">Your Score: <b>' + quizScore + ' / ' + quiz.length + '</b></p>';
          html += '<button class="btn primary" style="max-width:200px; margin:0 auto;" onclick="resetQuiz()">Try Again</button>';
          html += '</div>';
          return html;
        }

        var q = quiz[quizIdx];
        var html = '<div class="panel">';
        html += '<div class="topic-tag"><span>' + q.topic + '</span><span>Question ' + (quizIdx + 1) + ' / ' + quiz.length + '</span></div>';
        html += '<div class="q-text">' + q.q + '</div>';
        html += '<div class="opts">';
        q.opts.forEach(function (opt, idx) {
          var cls = 'opt';
          if (quizSelected !== null) {
            if (idx === q.ans) cls += ' right';
            else if (idx === quizSelected) cls += ' wrong';
          }
          html += '<button class="' + cls + '" ' + (quizSelected !== null ? 'disabled' : '') + ' onclick="selectOpt(' + idx + ')">' + opt + '</button>';
        });
        html += '</div>';
        if (quizSelected !== null) {
          html += '<button class="btn primary" style="margin-top:12px;" onclick="nextQuiz()">Next Question</button>';
        }
        html += '</div>';
        return html;
      }

      window.selectOpt = function (idx) {
        quizSelected = idx;
        if (idx === getQuiz()[quizIdx].ans) quizScore++;
        render();
      };

      window.nextQuiz = function () {
        quizIdx++;
        quizSelected = null;
        render();
      };

      window.resetQuiz = function () {
        quizIdx = 0; quizSelected = null; quizScore = 0;
        render();
      };

      function render() {
        renderHeader();
        var main = document.getElementById('view');
        if (tab === 'notes') main.innerHTML = renderNotes();
        else if (tab === 'study') main.innerHTML = renderStudy();
        else if (tab === 'quiz') main.innerHTML = renderQuiz();
      }

      render();
    })();
  </script>
</body>
</html>
